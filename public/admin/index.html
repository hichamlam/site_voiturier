    if (type === 'block')   item = STATE.blocks.find(x => x.id === id) || {};
  }

  let formHTML = '';
  let titleStr = '';
  if (type === 'rule') {
    titleStr = id ? 'Modifier une durée' : 'Nouvelle durée tarifée';
    formHTML = `
      <div class="form-grid">
        <div class="field"><label>Nombre de jours *</label><input type="number" id="pf-days" min="1" value="${item.days_min || 1}" required><div class="hint">Une ligne par durée : 1 jour = 29 €, 2 jours = 49 €, etc.</div></div>
        <div class="field"><label>Prix (€) *</label><input type="number" id="pf-price_eur" step="0.01" value="${item.price_eur || ''}" required></div>
        <div class="field full"><label>+ €/jour au-delà (optionnel)</label><input type="number" step="0.01" id="pf-extra_per_day_eur" value="${item.extra_per_day_eur || ''}"><div class="hint">À renseigner sur la dernière durée de la grille : chaque jour supplémentaire au-delà est facturé ce montant. Laisse vide pour un prix fixe.</div></div>
        <div class="field"><label>Libellé</label><input id="pf-label" value="${escapeHtml(item.label || '')}"></div>
      </div>
    `;
  } else if (type === 'special') {
    titleStr = id ? 'Modifier une période' : 'Nouvelle période spéciale';
    formHTML = `
      <div class="form-grid">
        <div class="field full"><label>Nom *</label><input id="pf-name" value="${escapeHtml(item.name || '')}" placeholder="Ex. Vacances de Noël 2026" required></div>
        <div class="field"><label>Date début *</label><input type="date" id="pf-date_start" value="${item.date_start || ''}" required></div>
        <div class="field"><label>Date fin *</label><input type="date" id="pf-date_end" value="${item.date_end || ''}" required></div>
        <div class="field"><label>Multiplicateur</label><input type="number" step="0.05" id="pf-multiplier" value="${item.multiplier || 1}"><div class="hint">Ex. 1.20 = +20%</div></div>
        <div class="field"><label>Supplément fixe (€)</label><input type="number" step="0.01" id="pf-flat_extra" value="${item.flat_extra || 0}"></div>
        <div class="field full"><label><input type="checkbox" id="pf-active" ${item.active !== false ? 'checked' : ''} style="width:auto;margin-right:6px"> Actif</label></div>
      </div>
    `;
  } else {
    titleStr = id ? 'Modifier des dates bloquées' : 'Bloquer des dates';
    formHTML = `
      <div class="form-grid">
        <div class="field"><label>Date début *</label><input type="date" id="pf-date_start" value="${item.date_start || ''}" required></div>
        <div class="field"><label>Date fin *</label><input type="date" id="pf-date_end" value="${item.date_end || ''}" required></div>
        <div class="field full"><label>Raison</label><input id="pf-reason" value="${escapeHtml(item.reason || '')}" placeholder="Complet, congés, etc."></div>
      </div>
    `;
  }

  const html = `
    <div class="modal-bg show" onclick="if(event.target.classList.contains('modal-bg'))closeModal()">
      <div class="modal-card">
        <div class="modal-head">
          <h2>${titleStr}</h2>
          <button class="modal-close-btn" onclick="closeModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        ${formHTML}
        <div class="flex-between mt-md">
          <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
          <button class="btn btn-primary" onclick="submitPricing('${type}'${id ? `,'${id}'` : ''})">Enregistrer</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalsContainer').innerHTML = html;
}

async function submitPricing(type, id) {
  try {
    let payload = {};
    if (type === 'rule') {
      const extraPerDay = document.getElementById('pf-extra_per_day_eur').value;
      payload = {
        // Une ligne = une durée précise : days_min et days_max sont identiques.
        days_min: parseInt(document.getElementById('pf-days').value, 10),
        days_max: parseInt(document.getElementById('pf-days').value, 10),
        price_eur: parseFloat(document.getElementById('pf-price_eur').value),
        extra_per_day_eur: extraPerDay ? parseFloat(extraPerDay) : null,
        label: document.getElementById('pf-label').value.trim(),
      };
    } else if (type === 'special') {
      payload = {
        name: document.getElementById('pf-name').value.trim(),
        date_start: document.getElementById('pf-date_start').value,
        date_end: document.getElementById('pf-date_end').value,
        multiplier: parseFloat(document.getElementById('pf-multiplier').value) || 1,
        flat_extra: parseFloat(document.getElementById('pf-flat_extra').value) || 0,
        active: document.getElementById('pf-active').checked,
      };
    } else {
      payload = {
        date_start: document.getElementById('pf-date_start').value,
        date_end: document.getElementById('pf-date_end').value,
        reason: document.getElementById('pf-reason').value.trim(),
      };
    }
    const url = `/api/admin/pricing?type=${type}` + (id ? `&id=${id}` : '');
    await api(url, { method: id ? 'PATCH' : 'POST', body: JSON.stringify(payload) });
    toast('Enregistré', 'success');
    closeModal();
    renderPricing();
  } catch (err) { toast(err.message, 'error'); }
}

async function deletePricing(type, id) {
  if (!confirm('Supprimer cet élément ?')) return;
  try {
    await api(`/api/admin/pricing?type=${type}&id=${id}`, { method: 'DELETE' });
    toast('Supprimé', 'success');
    renderPricing();
  } catch (err) { toast(err.message, 'error'); }
}

          <div class="field full"><label><input type="checkbox" id="prf-active" ${item.active !== false ? 'checked' : ''} style="width:auto;margin-right:6px"> Actif</label></div>
          <div class="field full"><label><input type="checkbox" id="prf-show_banner" ${item.show_banner ? 'checked' : ''} style="width:auto;margin-right:6px"> Afficher ce code en bannière sur le site</label>
            <div class="hint">Un seul code peut être diffusé à la fois : c'est le plus récent coché qui s'affiche.</div>
          </div>
          <div class="field full"><label><input type="checkbox" id="prf-first_booking_only" ${item.first_booking_only ? 'checked' : ''} style="width:auto;margin-right:6px"> Réservé à une première réservation</label></div>
        </div>
        <div class="flex-between mt-md">
          <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
          <button class="btn btn-primary" onclick="submitPromo(${id ? `'${id}'` : ''})">Enregistrer</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalsContainer').innerHTML = html;
}

async function submitPromo(id) {
  try {
    const payload = {
      code: document.getElementById('prf-code').value.trim().toUpperCase(),
      discount_type: document.getElementById('prf-discount_type').value,
      discount_val: parseFloat(document.getElementById('prf-discount_val').value),
      valid_from: document.getElementById('prf-valid_from').value || null,
      valid_until: document.getElementById('prf-valid_until').value || null,
      max_uses: parseInt(document.getElementById('prf-max_uses').value, 10) || null,
      active: document.getElementById('prf-active').checked,
      show_banner: document.getElementById('prf-show_banner').checked,
      first_booking_only: document.getElementById('prf-first_booking_only').checked,
    };
    const url = '/api/admin/promos' + (id ? '?id=' + id : '');
    await api(url, { method: id ? 'PATCH' : 'POST', body: JSON.stringify(payload) });
    toast('Enregistré', 'success');
    closeModal();
    renderPromos();
  } catch (err) { toast(err.message, 'error'); }
}

async function deletePromo(id) {
  if (!confirm('Supprimer ce code promo ?')) return;
  try {
    await api('/api/admin/promos?id=' + id, { method: 'DELETE' });
    toast('Supprimé', 'success');
    renderPromos();
  } catch (err) { toast(err.message, 'error'); }
}

async function renderCalendar() {
  const start = new Date(STATE.calDate.getFullYear(), STATE.calDate.getMonth() - 1, 1);
  const end = new Date(STATE.calDate.getFullYear(), STATE.calDate.getMonth() + 2, 0);
  const fromIso = localISO(start);
  const toIso = localISO(end);

  const [all, { blocks }] = await Promise.all([
    loadAll(true),
    api('/api/admin/pricing'),
  ]);
  const bookings = all.filter(b => b.departure_date <= toIso && b.return_date >= fromIso);
  STATE.bookings = bookings;
  STATE.blocks = blocks;
  await loadOps();

  const c = document.getElementById('viewContainer');
  c.innerHTML = `
    <div class="page-head">
      <div><div class="eyebrow">Départs ↗ et retours ↙</div><h1>Calendrier</h1></div>
      <div class="ph-actions"><button class="sqbtn primary" onclick="openBookingForm()" aria-label="Nouvelle réservation">${IC.plus}</button></div>
    </div>

    <div class="cal-toolbar">
      <div class="cal-nav">
        <button onclick="calPrev()" aria-label="Précédent">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="cal-title" id="calTitle"></div>
        <button onclick="calNext()" aria-label="Suivant">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <div class="flex gap-sm">
        <button class="btn btn-ghost btn-sm" onclick="calToday()">Aujourd'hui</button>
        <div class="cal-views">
          <button class="${STATE.calMode==='month'?'active':''}" onclick="calSetMode('month')">Mois</button>
          <button class="${STATE.calMode==='week'?'active':''}" onclick="calSetMode('week')">Semaine</button>
        </div>
      </div>
    </div>

    <div class="card" style="padding:8px;">
      <div style="display:flex; gap:14px; padding:8px 14px; font-size:0.78rem; flex-wrap:wrap;">
        <span class="flex" style="align-items:center; gap:6px;"><span style="width:12px; height:12px; background:#2E7FD3; border-radius:3px;"></span>Départ (aller)</span>
        <span class="flex" style="align-items:center; gap:6px;"><span style="width:12px; height:12px; background:#E5484D; border-radius:3px;"></span>Retour</span>
        <span class="flex" style="align-items:center; gap:6px;"><span style="width:12px; height:12px; background:#fee2e2; border-radius:3px;"></span>Bloqué</span>
        <span class="flex" style="align-items:center; gap:6px;"><span style="width:12px; height:12px; background:#EFF6FD; border:1px solid #2E7FD3; border-radius:3px;"></span>Aujourd'hui</span>
      </div>
      <div id="calBody"></div>
    </div>
    <div id="calDayList"></div>
  `;

  STATE.repaint = () => { drawCalendar(); paintCalDayList(); };
  drawCalendar();
  paintCalDayList();
}

function calPrev() {
  if (STATE.calMode === 'month') {
    STATE.calDate.setMonth(STATE.calDate.getMonth() - 1);
  } else {
    STATE.calDate.setDate(STATE.calDate.getDate() - 7);
  }
  renderCalendar();
}
function calNext() {
  if (STATE.calMode === 'month') {
    STATE.calDate.setMonth(STATE.calDate.getMonth() + 1);
  } else {
    STATE.calDate.setDate(STATE.calDate.getDate() + 7);
  }
  renderCalendar();
}
function calToday() {
  STATE.calDate = new Date();
  renderCalendar();
}
function calSetMode(mode) {
  STATE.calMode = mode;
  renderCalendar();
}

function drawCalendar() {
  document.getElementById('calTitle').textContent = STATE.calMode === 'month'
    ? fmtMonth(STATE.calDate)
    : weekRangeLabel(STATE.calDate);

  if (STATE.calMode === 'month') {
    drawMonthView();
  } else {
    drawWeekView();
  }
}

function isDateBlocked(iso) {
  return STATE.blocks.some(b => iso >= b.date_start && iso <= b.date_end);
}

function drawMonthView() {
  const year = STATE.calDate.getFullYear();
  const month = STATE.calDate.getMonth();
  const first = new Date(year, month, 1);
  const last = new Date(year, month + 1, 0);
  const startDay = (first.getDay() + 6) % 7; // lundi = 0
  const total = startDay + last.getDate();
  const rows = Math.ceil(total / 7);

  const todayIso = todayISO();

  const days = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  let html = '<div class="cal-month">';
  days.forEach(d => html += `<div class="cal-day-header">${d}</div>`);

  for (let i = 0; i < rows * 7; i++) {
    const dayNum = i - startDay + 1;
    const cur = new Date(year, month, dayNum);
    const iso = localISO(cur);
    const inMonth = cur.getMonth() === month;
    const isToday = iso === todayIso;
    const isBlocked = isDateBlocked(iso);

    const deps = STATE.bookings.filter(b => b.departure_date === iso && b.status !== 'cancelled');
    const rets = STATE.bookings.filter(b => b.return_date === iso && b.status !== 'cancelled');

    let classes = 'cal-day';
    if (!inMonth) classes += ' other-month';
    if (isToday) classes += ' today';
    if (isBlocked) classes += ' blocked';

    if (STATE.calSel === iso) classes += ' sel';
    html += `<div class="${classes}" data-iso="${iso}" onclick="selectCalDay('${iso}')">
      <div class="cal-day-num">${cur.getDate()}</div>
      <div class="cal-dots">${deps.length ? `<b class="d">↗${deps.length}</b>` : ''}${rets.length ? `<b class="r">↙${rets.length}</b>` : ''}</div>
      <div class="cal-events">
        ${deps.slice(0, 3).map(b => `<div class="cal-event dep" onclick="event.stopPropagation();openBookingDetail('${b.reference}')" title="${escapeHtml(b.customer_lastname)} - ${escapeHtml(b.car_plate)} - ${b.departure_time?.slice(0,5)}">${b.departure_time?.slice(0,5) || ''} ${escapeHtml(b.customer_lastname)}</div>`).join('')}
        ${rets.slice(0, 3).map(b => `<div class="cal-event ret" onclick="event.stopPropagation();openBookingDetail('${b.reference}')" title="${escapeHtml(b.customer_lastname)} - ${escapeHtml(b.car_plate)} - ${b.return_time?.slice(0,5)}">${b.return_time?.slice(0,5) || ''} ${escapeHtml(b.customer_lastname)}</div>`).join('')}
        ${(deps.length + rets.length) > 6 ? `<div class="text-tiny text-muted">+${deps.length + rets.length - 6} autres</div>` : ''}
      </div>
    </div>`;
  }
  html += '</div>';
  document.getElementById('calBody').innerHTML = html;
}

function weekRangeLabel(d) {
  const start = new Date(d);
  start.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  const end = new Date(start); end.setDate(start.getDate() + 6);
  return `${start.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })} → ${end.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' })}`;
}

function drawWeekView() {
  const start = new Date(STATE.calDate);
  start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
  const todayIso = todayISO();
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    days.push(d);
  }

  const dayNames = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

  let html = '<div class="cal-week">';
  html += '<div class="cal-week-header"></div>';
  days.forEach((d, i) => {
    const iso = localISO(d);
    const isToday = iso === todayIso;
    html += `<div class="cal-week-header${isToday ? ' today-h' : ''}">
      <div class="day">${dayNames[i]}</div>
      <div class="num">${d.getDate()}</div>
    </div>`;
  });

  // Ligne Départs
  html += '<div class="cal-week-row label">↗ Départs</div>';
  days.forEach(d => {
    const iso = localISO(d);
    const deps = STATE.bookings.filter(b => b.departure_date === iso && b.status !== 'cancelled');
    html += `<div class="cal-week-row cal-week-cell">
      ${deps.map(b => `<div class="cal-event dep" onclick="openBookingDetail('${b.reference}')" title="${escapeHtml(b.customer_lastname)} - ${escapeHtml(b.car_plate)}">
        ${b.departure_time?.slice(0,5)} ${escapeHtml(b.customer_lastname)} <span class="text-tiny" style="opacity:0.7">${escapeHtml(b.car_plate)}</span>
      </div>`).join('')}
    </div>`;
  });

  // Ligne Retours
  html += '<div class="cal-week-row label">↙ Retours</div>';
  days.forEach(d => {
    const iso = localISO(d);
    const rets = STATE.bookings.filter(b => b.return_date === iso && b.status !== 'cancelled');
    html += `<div class="cal-week-row cal-week-cell">
      ${rets.map(b => `<div class="cal-event ret" onclick="openBookingDetail('${b.reference}')" title="${escapeHtml(b.customer_lastname)} - ${escapeHtml(b.car_plate)}">
        ${b.return_time?.slice(0,5)} ${escapeHtml(b.customer_lastname)} <span class="text-tiny" style="opacity:0.7">${escapeHtml(b.car_plate)}</span>
      </div>`).join('')}
    </div>`;
  });

  // Ligne En stock
  html += '<div class="cal-week-row label">🅿️ En stock</div>';
  days.forEach(d => {
    const iso = localISO(d);
    const inStorage = STATE.bookings.filter(b =>
      b.status !== 'cancelled' &&
      b.departure_date <= iso && b.return_date >= iso
    );
    html += `<div class="cal-week-row cal-week-cell">
      ${inStorage.length > 0 ? `<div class="text-bold text-gold" style="font-size:1.2rem;">${inStorage.length}</div><div class="text-tiny text-muted">véhicule(s)</div>` : ''}
    </div>`;
  });

  html += '</div>';
  // Mobile : même semaine sous forme d'agenda (liste par jour)
  html += '<div class="cal-agenda">' + days.map(d => {
    const iso = localISO(d);
    const items = [
      ...STATE.bookings.filter(b => b.departure_date === iso && b.status !== 'cancelled').map(b => ({ b, type: 'in', k: hm(b.departure_time) })),
      ...STATE.bookings.filter(b => b.return_date === iso && b.status !== 'cancelled').map(b => ({ b, type: 'out', k: hm(b.return_time) })),
    ].sort((a, b) => a.k.localeCompare(b.k));
    return `<div class="grp-title">${fmtLongDay(iso)}${iso === todayIso ? ' · aujourd\'hui' : ''} <span>${items.length}</span></div>` +
      (items.length ? `<div class="klist">${items.map(i => krowHTML(i)).join('')}</div>` : '<div class="text-muted" style="padding:2px 2px 6px;font-size:.84rem;">Rien</div>');
  }).join('') + '</div>';
  document.getElementById('calBody').innerHTML = html;
}

function buildShareText(b, format = 'plain') {
  const fmtD = (iso) => {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('fr-FR', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
  };
  const t = (s) => (s || '').slice(0,5);
  const status = ({pending:'En attente', confirmed:'Confirmée', taken:'Prise en charge', in_storage:'En stock', returned:'Restituée', cancelled:'Annulée'})[b.status] || b.status;

  const lines = [];
  lines.push(`🚗 RÉSERVATION ${b.reference}`);
  lines.push(`Statut : ${status}${b.payment_status === 'paid' ? ' · ✓ Payé' : ' · ⏳ Paiement en attente'}`);
  lines.push('');
  lines.push('👤 CLIENT');
  lines.push(`${b.customer_firstname} ${b.customer_lastname}`);
  lines.push(`📱 ${b.customer_phone}`);
  lines.push(`📧 ${b.customer_email}`);
  if (b.customer_flight) lines.push(`✈️ Vol : ${b.customer_flight}`);
  lines.push('');
  lines.push('📅 VOYAGE');
  lines.push(`Aller : ${fmtD(b.departure_date)} à ${t(b.departure_time)}${b.departure_terminal ? ' · Terminal ' + b.departure_terminal : ''}`);
  lines.push(`Retour : ${fmtD(b.return_date)} à ${t(b.return_time)}${b.return_terminal ? ' · Terminal ' + b.return_terminal : ''}`);
  lines.push('');
  lines.push('🚙 VÉHICULE');
  lines.push(`${b.car_brand} ${b.car_model}${b.car_color ? ' · ' + b.car_color : ''}`);
  lines.push(`Plaque : ${b.car_plate}`);
  const catNames = {citadine:'Citadine', berline:'Berline / Break', suv:'SUV / Familial / Monospace', utilitaire:'Van / Utilitaire'};
  lines.push(`Catégorie : ${catNames[b.car_category_code] || b.car_category_code || 'Citadine'}`);
  lines.push('');
  lines.push('💰 TARIF');
  if (b.wash_type && b.wash_type !== 'none') {
    const wlbl = {exterieur:'Lavage extérieur', interieur:'Lavage intérieur', complet:'Lavage complet', premium:'Lavage premium'}[b.wash_type] || b.wash_type;
    lines.push(`${wlbl} : ${b.wash_price}€`);
  }
  if (b.has_covered_parking) lines.push(`🅿️ Parking couvert : +20€`);
  if (b.has_priority_access) lines.push(`⚡ Accès prioritaire : +20€`);
  if (b.promo_code) lines.push(`Code promo ${b.promo_code} : -${b.promo_discount}€`);
  lines.push(`💵 TOTAL : ${b.total_price}€`);

  if (b.parking_spot) {
    lines.push('');
    lines.push(`📍 Emplacement parking : ${b.parking_spot}`);
  }
  if (b.internal_notes) {
    lines.push('');
    lines.push(`📝 Notes : ${b.internal_notes}`);
  }
  lines.push('');
  lines.push('— Direct Voiturier');

  return lines.join('\n');
}

function shareViaWhatsApp() {
  const text = document.getElementById('shareText').value;
  const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank');
}

function shareViaSMS() {
  const text = document.getElementById('shareText').value;
  // Format SMS universel (iOS et Android)
  const url = `sms:?&body=${encodeURIComponent(text)}`;
  window.location.href = url;
}

function shareViaEmail() {
  const text = document.getElementById('shareText').value;
  const b = STATE.shareBooking;
  const subject = `Réservation Direct Voiturier — ${b.reference} — ${b.customer_firstname} ${b.customer_lastname}`;
  const url = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
  window.location.href = url;
}

async function copyShareText() {
  const text = document.getElementById('shareText').value;
  try {
    await navigator.clipboard.writeText(text);
    toast('Copié ! Tu peux le coller où tu veux.', 'success');
  } catch {
    // Fallback pour navigateurs anciens
    const ta = document.getElementById('shareText');
    ta.select();
    document.execCommand('copy');
    toast('Copié !', 'success');
  }
}

async function sendShareEmail(ref) {
  const to = document.getElementById('shareEmailTo').value.trim();
  const text = document.getElementById('shareText').value;
  if (!to || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) {
    toast('Email invalide', 'error');
    return;
  }
  try {
    await api('/api/admin/share-booking', {
      method: 'POST',
      body: JSON.stringify({ reference: ref, to, text }),
    });
    toast(`Email envoyé à ${to}`, 'success');
  } catch (err) {
    toast(err.message, 'error');
  }
}

async function submitSurcharge(kind, id) {
  try {
    const payload = {
      kind,
      name: document.getElementById('sf-name').value.trim(),
      description: document.getElementById('sf-description').value.trim(),
      amount_eur: parseFloat(document.getElementById('sf-amount_eur').value) || 0,
      display_order: parseInt(document.getElementById('sf-display_order').value, 10) || 0,
      active: document.getElementById('sf-active').checked,
    };
    if (kind === 'time_window') {
      payload.time_start = document.getElementById('sf-time_start').value;
      payload.time_end = document.getElementById('sf-time_end').value;
      payload.applies_to = document.getElementById('sf-applies_to').value;
    } else {
      payload.option_code = document.getElementById('sf-option_code').value.trim();
    }
    const url = '/api/admin/surcharges' + (id ? '?id=' + id : '');
    await api(url, { method: id ? 'PATCH' : 'POST', body: JSON.stringify(payload) });
    toast('Enregistré', 'success');
    closeModal();
    renderSurcharges();
  } catch (err) { toast(err.message, 'error'); }
}

async function deleteSurcharge(id) {
  if (!confirm('Supprimer ce supplément ?')) return;
  try {
    await api('/api/admin/surcharges?id=' + id, { method: 'DELETE' });
    toast('Supprimé', 'success');
    renderSurcharges();
  } catch (err) { toast(err.message, 'error'); }
}

      has_priority_access: document.getElementById('qf-priority').checked,
      promo_code: document.getElementById('qf-promo').value.trim() || null,
      notes: document.getElementById('qf-notes').value.trim(),
    };
    if (!payload.departure_date || !payload.return_date) {
      return toast('Dates requises', 'error');
    }
    const { quote } = await api('/api/admin/quotes', { method: 'POST', body: JSON.stringify(payload) });
    toast(`Devis ${quote.reference} créé`, 'success');
    closeModal();
    renderQuotes();
  } catch (err) { toast(err.message, 'error'); }
}

async function sendQuote(id) {
  try {
    await api('/api/admin/quotes-send', { method: 'POST', body: JSON.stringify({ id }) });
    toast('Devis envoyé', 'success');
    renderQuotes();
  } catch (err) { toast(err.message, 'error'); }
}

async function convertQuote(id) {
  if (!confirm('Convertir ce devis en réservation ?')) return;
  try {
    const { booking } = await api('/api/admin/quotes?action=convert&id=' + id, { method: 'POST' });
    toast(`Réservation ${booking.reference} créée`, 'success');
    renderQuotes();
  } catch (err) { toast(err.message, 'error'); }
}

async function deleteQuote(id) {
  if (!confirm('Supprimer ce devis ?')) return;
  try {
    await api('/api/admin/quotes?id=' + id, { method: 'DELETE' });
    toast('Supprimé', 'success');
    renderQuotes();
  } catch (err) { toast(err.message, 'error'); }
}

/* ════════════════════════════════════════════════════════════
   VIEW: TEMPLATES (modèles de message SMS / email)
═══════════════════════════════════════════════════════════ */
function channelLabel(ch) { return ch === 'sms' ? 'SMS' : 'Email'; }

async function renderTemplates() {
  const { templates } = await api('/api/admin/templates');
  STATE.templates = templates;
  const c = document.getElementById('viewContainer');
  c.innerHTML = `
    <div class="topbar">
      <div>
        <h1>Messages</h1>
        <p class="sub">${templates.length} modèle(s) de message</p>
      </div>
      <button class="btn btn-gold" onclick="openTemplateForm()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Nouveau modèle
      </button>
    </div>

    <div class="card card-pad-0">
      ${templates.length === 0 ? '<div class="empty"><p>Aucun modèle</p></div>' : `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Nom</th><th>Code</th><th>Canal</th><th>Statut</th><th></th></tr></thead>
            <tbody>
              ${templates.map(t => `
                <tr>
                  <td class="text-bold">${escapeHtml(t.name)}</td>
                  <td class="font-mono text-tiny">${escapeHtml(t.code)}</td>
                  <td>${channelLabel(t.channel)}</td>
                  <td>${t.active !== false ? '<span class="text-success">✓ Actif</span>' : '<span class="text-muted">Inactif</span>'}</td>
                  <td class="text-right">
                    <button class="btn btn-ghost btn-sm" onclick="openTemplateForm('${t.id}')">Modifier</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteTemplate('${t.id}')">×</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;
}

function openTemplateForm(id) {
  const item = id ? (STATE.templates.find(x => x.id === id) || {}) : {};
  const titleStr = id ? 'Modifier le modèle' : 'Nouveau modèle de message';
  const html = `
    <div class="modal-bg show" onclick="if(event.target.classList.contains('modal-bg'))closeModal()">
      <div class="modal-card lg">
        <div class="modal-head">
          <h2>${titleStr}</h2>
          <button class="modal-close-btn" onclick="closeModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="form-grid">
          <div class="field"><label>Nom *</label><input id="tf-name" value="${escapeHtml(item.name || '')}" required></div>
          <div class="field"><label>Code *</label><input id="tf-code" value="${escapeHtml(item.code || '')}" ${id ? 'readonly' : ''} required></div>
          <div class="field"><label>Canal *</label>
            <select id="tf-channel" onchange="document.getElementById('tf-subject-field').style.display = this.value === 'email' ? '' : 'none'">
              <option value="sms" ${item.channel === 'sms' ? 'selected' : ''}>SMS</option>
              <option value="email" ${item.channel === 'email' ? 'selected' : ''}>Email</option>
            </select>
          </div>
          <div class="field" id="tf-subject-field" style="display:${item.channel === 'email' ? '' : 'none'}">
            <label>Objet (email)</label><input id="tf-subject" value="${escapeHtml(item.subject || '')}">
          </div>
          <div class="field full"><label>Message * <span class="text-tiny text-muted">(variables : {{firstname}}, {{reference}}, {{dep_date}}, {{dep_time}}, {{terminal}}, {{phone_business}}, {{car_brand}}, {{car_model}}, {{car_plate}}…)</span></label>
            <textarea id="tf-body" rows="8" required>${escapeHtml(item.body || '')}</textarea>
          </div>
          <div class="field full"><label><input type="checkbox" id="tf-active" ${item.active !== false ? 'checked' : ''} style="width:auto;margin-right:6px"> Actif</label></div>
        </div>
        <div class="flex-between mt-md">
          <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
          <button class="btn btn-primary" onclick="submitTemplate(${id ? `'${id}'` : 'undefined'})">Enregistrer</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalsContainer').innerHTML = html;
}

async function submitTemplate(id) {
  try {
    const channel = document.getElementById('tf-channel').value;
    const payload = {
      name: document.getElementById('tf-name').value.trim(),
      code: document.getElementById('tf-code').value.trim(),
      channel,
      subject: channel === 'email' ? document.getElementById('tf-subject').value.trim() : '',
      body: document.getElementById('tf-body').value.trim(),
      active: document.getElementById('tf-active').checked,
    };
    const url = '/api/admin/templates' + (id ? '?id=' + id : '');
    await api(url, { method: id ? 'PATCH' : 'POST', body: JSON.stringify(payload) });
    toast('Enregistré', 'success');
    closeModal();
    renderTemplates();
  } catch (err) { toast(err.message, 'error'); }
}

async function deleteTemplate(id) {
  if (!confirm('Supprimer ce modèle ?')) return;
  try {
    await api('/api/admin/templates?id=' + id, { method: 'DELETE' });
    toast('Supprimé', 'success');
    renderTemplates();
  } catch (err) { toast(err.message, 'error'); }
}

/* ════════════════════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════════════════ */
if (STATE.token) {
  showApp();
} else {
  document.getElementById('loginScreen').style.display = 'flex';
}
</script>
</body>
</html>
