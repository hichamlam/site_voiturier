<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Back-office — Direct Voiturier</title>
<link rel="manifest" href="/admin/manifest.json">
<meta name="theme-color" content="#1B5FA8">
<link rel="apple-touch-icon" href="/admin/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DV Admin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  /* Palette du site : bleu. (Les noms --gold* sont conservés pour ne pas
     toucher tout le CSS existant, mais ils valent maintenant le bleu du site.) */
  --gold: #2E7FD3;
  --gold-deep: #1B5FA8;
  --gold-pale: #EFF6FD;
  --blue-light: #8CBCE8;
  --accent: #EBA83C;
  --ink: #0B1426;
  --ink-soft: #1a2338;
  --slate: #4a5576;
  --muted: #94a3b8;
  --line: #e5e7eb;
  --bg: #F8FAFC;
  --success: #10b981;
  --warning: #f59e0b;
  --error: #ef4444;
  --info: #3b82f6;
}
body {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; }

/* ── Login ── */
.login-screen {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(178deg, #12406F 0%, #1B5FA8 40%, #2E7FD3 100%);
  padding: 20px;
}
.login-box {
  background: white;
  border-radius: 22px;
  padding: 40px 36px;
  width: 100%; max-width: 380px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.4);
}
.login-box .logo {
  display: flex; align-items: center; gap: 10px; justify-content: center;
  margin-bottom: 24px;
}
.login-box .logo-mark {
  width: 40px; height: 40px;
  background: var(--gold); border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
}
.login-box .logo-mark svg { width: 22px; height: 22px; color: white; }
.login-box h1 { font-size: 1.4rem; font-weight: 800; }
.login-box .sub { font-size: 0.86rem; color: var(--slate); }
.login-box label { display:block; font-size: 0.78rem; font-weight: 700; color: var(--slate); margin: 18px 0 6px; }
.login-box input {
  width: 100%; padding: 13px 14px; background: var(--bg);
  border: 1.5px solid transparent; border-radius: 10px;
  font-size: 0.95rem; font-weight: 600; outline: none;
  transition: all 0.2s;
}
.login-box input:focus { border-color: var(--gold); background: white; }
.login-box input { font-size: 16px; }
.login-box button {
  width: 100%; margin-top: 18px;
  padding: 13px;
  background: var(--ink); color: white;
  border-radius: 100px;
  font-weight: 700; font-size: 0.95rem;
  transition: all 0.2s;
}
.login-box button:hover { transform: translateY(-1px); background: var(--gold-deep); color: white; }
.login-error { color: var(--error); font-size: 0.82rem; margin-top: 12px; font-weight: 600; }

/* ── Layout ── */
.app { display: none; min-height: 100vh; }
.app.show { display: flex; }
.sidebar {
  width: 240px;
  background: linear-gradient(180deg, #12406F 0%, #1B5FA8 100%);
  color: white;
  display: flex; flex-direction: column;
  position: fixed; left: 0; top: 0; bottom: 0;
  z-index: 50;
  transition: transform 0.3s;
}
.sidebar-head {
  padding: 22px 20px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.sidebar-head .logo-mark {
  width: 34px; height: 34px;
  background: var(--gold); border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}
.sidebar-head .logo-mark { background: rgba(255,255,255,0.16) !important; }
.sidebar-head .logo-mark svg { width: 18px; height: 18px; color: white; }
.sidebar-head .name { font-weight: 800; font-size: 1rem; }
.sidebar-head .tag { font-size: 0.62rem; color: var(--blue-light); letter-spacing: 0.16em; text-transform: uppercase; }
.sidebar-nav { flex: 1; padding: 12px 10px; }
.sidebar-nav button {
  width: 100%;
  padding: 11px 14px;
  display: flex; align-items: center; gap: 12px;
  color: rgba(255,255,255,0.7);
  font-size: 0.9rem; font-weight: 600;
  border-radius: 10px;
  margin-bottom: 3px;
  transition: all 0.2s;
  text-align: left;
}
.sidebar-nav button svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-nav button:hover { background: rgba(255,255,255,0.06); color: white; }
.sidebar-nav button.active { background: white; color: var(--gold-deep); }
.sidebar-nav { overflow-y: auto; }
.nav-sep { height: 1px; background: rgba(255,255,255,0.12); margin: 8px 6px; }
.sidebar-foot { padding: 14px; border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-foot button {
  width: 100%; padding: 10px; color: rgba(255,255,255,0.6);
  font-size: 0.84rem; font-weight: 600;
  display: flex; align-items: center; gap: 10px;
}
.sidebar-foot button:hover { color: white; }
.sidebar-foot svg { width: 16px; height: 16px; }

.main {
  flex: 1; margin-left: 240px;
  padding: 28px 36px;
  min-height: 100vh;
}

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px; flex-wrap: wrap; gap: 16px;
}
.topbar h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }
.topbar .sub { font-size: 0.86rem; color: var(--slate); margin-top: 2px; }

.btn {
  padding: 10px 18px;
  border-radius: 100px;
  font-size: 0.84rem; font-weight: 700;
  display: inline-flex; align-items: center; gap: 8px;
  transition: all 0.2s;
}
.btn svg { width: 14px; height: 14px; }
.btn-primary { background: var(--ink); color: white; }
.btn-primary:hover { background: var(--gold-deep); color: white; transform: translateY(-1px); }
.btn-gold { background: var(--gold); color: white; }
.btn-gold:hover { background: var(--gold-deep); }
.btn-block { width: 100%; justify-content: center; }
.btn-ghost { background: white; color: var(--ink); border: 1.5px solid var(--line); }
.btn-ghost:hover { border-color: var(--gold); }
.btn-danger { background: var(--error); color: white; }
.btn-danger:hover { background: #dc2626; }
.btn-sm { padding: 7px 13px; font-size: 0.78rem; }

/* ── Cards ── */
.card {
  background: white;
  border-radius: 16px;
  border: 1px solid var(--line);
  padding: 20px;
  margin-bottom: 16px;
}
.card-pad-0 { padding: 0; overflow: hidden; }

/* ── Stats grid ── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.stat {
  background: white;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px 20px;
}
.stat-label {
  font-size: 0.7rem; font-weight: 700;
  color: var(--slate);
  letter-spacing: 0.1em; text-transform: uppercase;
  margin-bottom: 6px;
}
.stat-val {
  font-size: 1.8rem; font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.stat-val .cur { font-size: 1rem; color: var(--slate); margin-left: 2px; }
.stat-trend { font-size: 0.74rem; color: var(--success); margin-top: 4px; font-weight: 600; }
.stat.gold { background: linear-gradient(135deg, var(--gold-pale), white); border-color: var(--gold); }
.stat.gold .stat-val { color: var(--gold-deep); }

/* ── Tables ── */
.table-wrap { overflow-x: auto; border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
th, td { padding: 12px 14px; text-align: left; }
th {
  font-size: 0.7rem; font-weight: 700;
  color: var(--slate); letter-spacing: 0.08em;
  text-transform: uppercase;
  border-bottom: 2px solid var(--line);
  background: var(--bg);
  white-space: nowrap;
}
tbody tr { border-bottom: 1px solid var(--line); cursor: pointer; transition: background 0.15s; }
tbody tr:hover { background: var(--bg); }
tbody tr:last-child { border-bottom: none; }

/* ── Status badges ── */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px;
  border-radius: 100px;
  font-size: 0.72rem; font-weight: 700;
  white-space: nowrap;
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; }
.badge-pending     { background: #fef3c7; color: #92400e; }
.badge-pending .dot { background: #f59e0b; }
.badge-confirmed   { background: #dbeafe; color: #1e40af; }
.badge-confirmed .dot { background: #3b82f6; }
.badge-taken       { background: #ede9fe; color: #5b21b6; }
.badge-taken .dot  { background: #8b5cf6; }
.badge-in_storage  { background: #d1fae5; color: #065f46; }
.badge-in_storage .dot { background: #10b981; }
.badge-returned    { background: #f3f4f6; color: #374151; }
.badge-returned .dot { background: #6b7280; }
.badge-cancelled   { background: #fee2e2; color: #991b1b; }
.badge-cancelled .dot { background: #ef4444; }

.payment-paid { color: var(--success); font-weight: 700; }
.payment-pending { color: var(--warning); font-weight: 700; }

/* ── Filters bar ── */
.filters {
  display: flex; gap: 10px; flex-wrap: wrap;
  margin-bottom: 16px; align-items: center;
}
.filters input, .filters select {
  padding: 9px 14px;
  background: white;
  border: 1.5px solid var(--line);
  border-radius: 100px;
  font-size: 0.86rem; font-weight: 600;
  outline: none;
  transition: all 0.2s;
}
.filters input:focus, .filters select:focus { border-color: var(--gold); }
.filters input[type="search"] { min-width: 220px; }

/* ── Calendar ── */
.cal-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px;
  margin-bottom: 18px;
}
.cal-nav { display: flex; gap: 8px; align-items: center; }
.cal-nav button {
  width: 34px; height: 34px;
  background: white; border: 1.5px solid var(--line);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.cal-nav button:hover { border-color: var(--gold); }
.cal-nav button svg { width: 14px; height: 14px; }
.cal-title {
  font-size: 1.2rem; font-weight: 800;
  letter-spacing: -0.01em;
  min-width: 200px; text-align: center;
  text-transform: capitalize;
}
.cal-views { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 100px; }
.cal-views button {
  padding: 7px 16px;
  font-size: 0.82rem; font-weight: 700;
  border-radius: 100px;
  color: var(--slate);
  transition: all 0.2s;
}
.cal-views button.active { background: var(--gold-deep); color: white; }

.cal-month {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1px;
  background: var(--line);
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.cal-day-header {
  background: var(--bg);
  padding: 12px 10px;
  font-size: 0.72rem; font-weight: 800;
  color: var(--slate);
  text-transform: uppercase; letter-spacing: 0.08em;
  text-align: center;
}
.cal-day {
  background: white;
  min-height: 110px;
  padding: 8px 10px;
  position: relative;
  cursor: pointer;
  transition: background 0.15s;
}
.cal-day:hover { background: var(--bg); }
.cal-day.other-month { background: #fafbfc; }
.cal-day.other-month .cal-day-num { color: var(--muted); }
.cal-day.today { background: var(--gold-pale); }
.cal-day.today .cal-day-num {
  background: var(--gold-deep); color: white;
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800;
}
.cal-day.blocked { background: #fee2e2; }
.cal-day-num { font-size: 0.85rem; font-weight: 800; color: var(--ink); margin-bottom: 6px; }
.cal-events { display: flex; flex-direction: column; gap: 3px; }
.cal-event {
  font-size: 0.7rem; font-weight: 700;
  padding: 3px 7px;
  border-radius: 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  cursor: pointer;
  transition: transform 0.1s;
}
.cal-event:hover { transform: translateX(2px); }
.cal-event.dep { background: #dbeafe; color: #1e40af; border-left: 3px solid #3b82f6; }
.cal-event.ret { background: #fef3c7; color: #92400e; border-left: 3px solid #f59e0b; }
.cal-event.dep::before { content: '↗ '; }
.cal-event.ret::before { content: '↙ '; }

/* Week view */
.cal-week {
  display: grid;
  grid-template-columns: 70px repeat(7, 1fr);
  background: var(--line);
  gap: 1px;
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
.cal-week-header { background: var(--bg); padding: 12px 8px; text-align: center; font-size: 0.78rem; font-weight: 800; }
.cal-week-header.today-h { background: var(--gold-pale); color: var(--gold-deep); }
.cal-week-header .day { font-size: 0.7rem; color: var(--slate); text-transform: uppercase; letter-spacing: 0.08em; }
.cal-week-header .num { font-size: 1.2rem; font-weight: 800; }
.cal-week-row { background: white; padding: 8px; min-height: 80px; font-size: 0.78rem; }
.cal-week-row.label {
  background: var(--bg); font-weight: 800; color: var(--slate);
  display: flex; align-items: center; justify-content: center;
  text-align: center; font-size: 0.72rem;
  text-transform: uppercase; letter-spacing: 0.08em;
}
.cal-week-cell {
  display: flex; flex-direction: column; gap: 4px;
  padding: 6px;
}

/* ── Modals ── */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(11,20,38,0.7);
  backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;
  z-index: 100;
  padding: 20px;
  overflow-y: auto;
}
.modal-bg.show { display: flex; }
.modal-card {
  background: white;
  border-radius: 18px;
  width: 100%; max-width: 600px;
  max-height: 92vh;
  overflow-y: auto;
  padding: 28px 32px;
  margin: auto;
}
.modal-card.lg { max-width: 760px; }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 22px;
}
.modal-head h2 {
  font-size: 1.3rem; font-weight: 800;
  letter-spacing: -0.01em;
}
.modal-close-btn {
  width: 32px; height: 32px;
  border-radius: 50%; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.modal-close-btn:hover { background: var(--ink); color: white; }
.modal-close-btn svg { width: 16px; height: 16px; }

/* ── Forms ── */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 14px;
  margin-bottom: 16px;
}
.form-grid .full { grid-column: 1 / -1; }
.field label {
  display: block;
  font-size: 0.72rem; font-weight: 700;
  color: var(--slate);
  letter-spacing: 0.04em; text-transform: uppercase;
  margin-bottom: 5px;
}
.field input, .field select, .field textarea {
  width: 100%;
  padding: 11px 13px;
  background: var(--bg);
  border: 1.5px solid transparent;
  border-radius: 10px;
  font-size: 0.9rem;
  font-weight: 500;
  outline: none;
  transition: all 0.2s;
}
.field input:focus, .field select:focus, .field textarea:focus {
  background: white;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(46,127,211,0.16);
}
.field textarea { min-height: 80px; resize: vertical; }
.field .hint { font-size: 0.74rem; color: var(--muted); margin-top: 4px; font-weight: 500; }

/* ── Booking detail status flow ── */
.status-flow {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin: 16px 0;
}
.status-btn {
  padding: 8px 14px;
  border: 1.5px solid var(--line);
  background: white;
  border-radius: 100px;
  font-size: 0.78rem; font-weight: 700;
  color: var(--slate);
  display: inline-flex; align-items: center; gap: 6px;
  transition: all 0.2s;
}
.status-btn:hover { border-color: var(--gold); color: var(--ink); }
.status-btn.confirmed:hover { background: #dbeafe; border-color: #3b82f6; color: #1e40af; }
.status-btn.taken:hover { background: #ede9fe; border-color: #8b5cf6; color: #5b21b6; }
.status-btn.in_storage:hover { background: #d1fae5; border-color: #10b981; color: #065f46; }
.status-btn.returned:hover { background: #f3f4f6; border-color: #6b7280; color: #374151; }
.status-btn.cancelled:hover { background: #fee2e2; border-color: #ef4444; color: #991b1b; }

/* ── Empty state ── */
.empty {
  text-align: center; padding: 50px 20px;
  color: var(--slate);
}
.empty svg { width: 60px; height: 60px; margin: 0 auto 16px; opacity: 0.4; }
.empty p { font-size: 0.96rem; font-weight: 600; }

/* ── Utility ── */
.flex { display: flex; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.gap-sm { gap: 8px; }
.gap-md { gap: 14px; }
.mt-sm { margin-top: 10px; }
.mt-md { margin-top: 16px; }
.mt-lg { margin-top: 24px; }
.mb-sm { margin-bottom: 10px; }
.mb-md { margin-bottom: 16px; }
.text-muted { color: var(--slate); font-size: 0.84rem; }
.text-tiny { font-size: 0.74rem; }
.text-bold { font-weight: 800; }
.text-gold { color: var(--gold-deep); }
.text-error { color: var(--error); }
.text-success { color: var(--success); }
.text-right { text-align: right; }
.font-mono { font-family: ui-monospace, 'SF Mono', monospace; }

.toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: var(--ink); color: white;
  padding: 13px 20px;
  border-radius: 12px;
  font-size: 0.86rem; font-weight: 600;
  box-shadow: 0 12px 30px rgba(0,0,0,0.3);
  z-index: 200;
  transform: translateY(100px);
  opacity: 0;
  transition: all 0.3s;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast { pointer-events: none; }
.toast.success { background: var(--success); }
.toast.error { background: var(--error); }

.spinner {
  width: 16px; height: 16px;
  border: 2.5px solid rgba(0,0,0,0.1);
  border-top-color: var(--ink);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

.loading {
  padding: 60px;
  text-align: center;
  color: var(--slate);
}

.btn-primary { background: var(--gold-deep); color: white; }
.btn-primary:hover { background: #12406F; color: white; }
.btn-lg { padding: 14px 20px; font-size: 0.92rem; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.sec-title { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--slate); margin: 22px 0 10px; display:flex; align-items:center; gap:8px; }
.sec-title:first-child { margin-top: 0; }

/* ── Chips / onglets / barre de dates ── */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; padding: 9px 15px; border-radius: 100px; border: 1.5px solid var(--line); background: #fff; font-size: 0.82rem; font-weight: 700; color: var(--slate); white-space: nowrap; transition: all .15s; }
.chip.on { background: var(--gold-deep); border-color: var(--gold-deep); color: #fff; }
.chip .n { opacity: .65; margin-left: 5px; font-weight: 800; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: #E4ECF6; padding: 4px; border-radius: 14px; gap: 4px; margin-bottom: 12px; }
.tabs button { padding: 11px 6px; border-radius: 11px; font-weight: 800; font-size: 0.86rem; color: var(--slate); display: flex; align-items: center; justify-content: center; gap: 7px; }
.tabs button.on { background: #fff; color: var(--gold-deep); box-shadow: 0 2px 8px rgba(11,20,38,.12); }
.tabs .n { min-width: 22px; padding: 1px 7px; border-radius: 100px; background: rgba(27,95,168,.12); color: var(--gold-deep); font-size: .74rem; }
.tabs button.on .n { background: var(--gold-deep); color: #fff; }
.datebar { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 12px; }
.datebar .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.datebar .row:first-child { margin-top: 0; }
.datebar input[type=date] { flex: 1; min-width: 0; padding: 11px 12px; background: var(--bg); border: 1.5px solid transparent; border-radius: 10px; font-weight: 600; font-size: .9rem; outline: none; }
.datebar input[type=date]:focus { border-color: var(--gold); background: #fff; }
.datebar .label { flex: 1; text-align: center; font-weight: 800; text-transform: capitalize; }
.roundbtn { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: #fff; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.roundbtn svg { width: 16px; height: 16px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.kpi { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px 8px; text-align: center; }
.kpi b { display: block; font-size: 1.4rem; font-weight: 800; color: var(--gold-deep); line-height: 1.1; }
.kpi span { font-size: .66rem; font-weight: 700; color: var(--slate); text-transform: uppercase; letter-spacing: .06em; }

/* ── Cartes de réservation ── */
.rcards { display: flex; flex-direction: column; gap: 10px; }
.rcard { background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--gold); border-radius: 16px; padding: 14px; cursor: pointer; }
.rcard.st-pending { border-left-color: #f59e0b; }
.rcard.st-taken { border-left-color: #8b5cf6; }
.rcard.st-in_storage { border-left-color: #10b981; }
.rcard.st-returned { border-left-color: #9ca3af; opacity: .85; }
.rcard.st-cancelled { border-left-color: #ef4444; opacity: .7; }
.rc-top { display: flex; align-items: center; gap: 12px; }
.rc-time { font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em; color: var(--gold-deep); min-width: 64px; line-height: 1.1; }
.rc-time small { display: block; font-size: .64rem; font-weight: 700; color: var(--slate); letter-spacing: .04em; text-transform: uppercase; }
.rc-main { flex: 1; min-width: 0; }
.rc-name { font-weight: 800; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-sub { font-size: .8rem; color: var(--slate); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
.pill { font-size: .72rem; font-weight: 700; padding: 4px 10px; border-radius: 100px; background: var(--bg); color: var(--slate); white-space: nowrap; }
.pill.blue { background: #EFF6FD; color: var(--gold-deep); }
.pill.paid { background: #d1fae5; color: #065f46; }
.pill.unpaid { background: #fef3c7; color: #92400e; }
.rc-actions { display: flex; gap: 8px; margin-top: 12px; }
.rc-actions .btn { flex: 1; justify-content: center; padding: 12px 10px; }
.rc-actions .iconbtn { flex: 0 0 46px; }
.iconbtn { width: 46px; height: 46px; border-radius: 14px; background: var(--gold-pale); color: var(--gold-deep); display: inline-flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0; }
.iconbtn svg { width: 19px; height: 19px; }
.contact-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0 4px; }
.contact-row a, .contact-row button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 11px 4px; border-radius: 14px; background: var(--gold-pale); color: var(--gold-deep); font-size: .72rem; font-weight: 800; text-decoration: none; }
.contact-row svg { width: 20px; height: 20px; }

/* ── Fiche réservation ── */
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.seg button { padding: 12px 8px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; font-weight: 800; font-size: .8rem; color: var(--slate); }
.seg button.on { background: var(--gold-deep); border-color: var(--gold-deep); color: #fff; }
.seg button.s-cancelled.on { background: var(--error); border-color: var(--error); }
.seg button.s-pay.on { background: var(--success); border-color: var(--success); }
.box { background: var(--bg); border-radius: 14px; padding: 14px; margin-bottom: 4px; }
.box .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.box .row:first-child { margin-top: 0; }
.box select { flex: 1; min-width: 140px; padding: 12px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; font-weight: 600; font-size: .9rem; }
.big-price { font-size: 1.7rem; font-weight: 800; color: var(--gold-deep); letter-spacing: -.02em; }
.sheet-foot { position: sticky; bottom: -28px; background: #fff; padding: 14px 0 4px; margin-top: 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; z-index: 3; }
.check { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: .9rem; padding: 6px 0; }
.check input { width: 20px; height: 20px; accent-color: var(--gold-deep); flex-shrink: 0; }
.switch { position: relative; width: 50px; height: 30px; flex-shrink: 0; }
.switch input { opacity: 0; position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 2; }
.switch i { position: absolute; inset: 0; background: #cbd5e1; border-radius: 100px; transition: .2s; }
.switch i::after { content: ''; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.switch input:checked + i { background: var(--success); }
.switch input:checked + i::after { transform: translateX(20px); }
.search-results { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 8px; background: #fff; }
.search-results button { display: block; width: 100%; text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.search-results button:last-child { border-bottom: 0; }
.search-results button:hover { background: var(--gold-pale); }
.carpick { display: flex; flex-direction: column; gap: 8px; }
.carpick button { text-align: left; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; font-weight: 700; font-size: .88rem; display: flex; justify-content: space-between; gap: 8px; }
.carpick button.on { border-color: var(--gold); background: var(--gold-pale); }
.var-chip { padding: 5px 10px; border-radius: 100px; background: var(--gold-pale); color: var(--gold-deep); font-size: .72rem; font-weight: 700; font-family: ui-monospace, monospace; }
.auto-card { border-left: 5px solid var(--gold); }
.auto-card.off { border-left-color: #cbd5e1; }
.cal-dots { display: none; }

/* ── Navigation mobile ── */
.mobile-topbar { display: none; }
.bottom-nav { display: none; }
.sidebar-backdrop { display: none; }
.mobile-menu { display: none; width: 42px; height: 42px; background: rgba(255,255,255,0.16); color: white; border-radius: 12px; align-items: center; justify-content: center; flex-shrink: 0; }
.mobile-menu svg { width: 22px; height: 22px; }
.sidebar-close { display: none; }

@media (max-width: 900px) {
  body { font-size: 15px; }
  .mobile-topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    position: fixed; top: 0; left: 0; right: 0; z-index: 40;
    background: linear-gradient(135deg, #12406F, #1B5FA8);
    color: white; padding: 10px 14px; padding-top: calc(10px + env(safe-area-inset-top));
  }
  .mobile-topbar .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .mobile-topbar .brand .logo-mark { width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center; }
  .mobile-topbar .brand svg { width: 18px; height: 18px; }
  .mobile-topbar .name { font-weight: 800; font-size: 1rem; line-height: 1.1; }
  .mobile-topbar .name small { display: block; font-size: .6rem; letter-spacing: .16em; text-transform: uppercase; color: var(--blue-light); font-weight: 700; }
  .mobile-menu { display: flex; }

  .sidebar { left: auto; right: 0; width: min(86vw, 330px); transform: translateX(100%); box-shadow: -20px 0 60px rgba(0,0,0,.35); padding-top: env(safe-area-inset-top); z-index: 60; }
  .sidebar.open { transform: translateX(0); }
  .sidebar-close { display: flex; margin-left: auto; width: 38px; height: 38px; border-radius: 10px; background: rgba(255,255,255,.14); color: #fff; align-items: center; justify-content: center; }
  .sidebar-close svg { width: 18px; height: 18px; }
  .sidebar-nav button { padding: 14px 14px; font-size: 1rem; }
  .sidebar-backdrop.open { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(11,20,38,0.5); }

  .main { margin-left: 0; padding: 14px; padding-top: calc(70px + env(safe-area-inset-top)); padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  .topbar { margin-bottom: 14px; gap: 10px; }
  .topbar h1 { font-size: 1.35rem; }
  .topbar .btn { padding: 11px 16px; }

  .bottom-nav {
    display: grid; grid-template-columns: 1fr 1fr 70px 1fr 1fr; align-items: end;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
    background: #fff; border-top: 1px solid var(--line);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    box-shadow: 0 -6px 24px rgba(11,20,38,.08);
  }
  .bottom-nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .68rem; font-weight: 700; color: var(--muted); padding: 7px 2px; border-radius: 12px; }
  .bottom-nav button svg { width: 23px; height: 23px; }
  .bottom-nav button.active { color: var(--gold-deep); }
  .bottom-nav .fab { width: 58px; height: 58px; border-radius: 50%; background: var(--gold-deep); color: #fff; margin: -26px auto 0; padding: 0; justify-content: center; box-shadow: 0 8px 20px rgba(27,95,168,.45); border: 4px solid #fff; }
  .bottom-nav .fab svg { width: 26px; height: 26px; }

  .form-grid { grid-template-columns: 1fr; }
  .field input, .field select, .field textarea, .filters input, .filters select { font-size: 16px; min-height: 46px; }
  .filters { gap: 8px; }
  .filters input, .filters select { flex: 1 1 140px; min-width: 0; }
  .filters input[type="search"] { min-width: 0; flex-basis: 100%; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat { padding: 14px; }
  .stat-val { font-size: 1.5rem; }
  .btn { min-height: 42px; }
  .btn-sm { min-height: 38px; }
  .card { padding: 16px; border-radius: 14px; }
  .card-pad-0 { padding: 0; }

  .modal-bg { padding: 0; align-items: flex-end; }
  .modal-card, .modal-card.lg { max-width: none; width: 100%; max-height: 94vh; max-height: 94dvh; border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); margin: 0; }
  .modal-head { margin-bottom: 14px; }
  .modal-head h2 { font-size: 1.15rem; }
  .sheet-foot { bottom: calc(-18px - env(safe-area-inset-bottom)); }
  .sheet-foot .btn { flex: 1; justify-content: center; }
  .bk-detail-grid { grid-template-columns: 1fr !important; gap: 14px !important; }

  .toast { left: 16px; right: 16px; bottom: calc(92px + env(safe-area-inset-bottom)); text-align: center; }

  /* Tableaux → cartes empilées (classe ajoutée par enhanceTables) */
  .table-wrap { overflow-x: visible; }
  table.stack, table.stack tbody { display: block; }
  table.stack thead { display: none; }
  table.stack tr { display: block; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  table.stack td { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 5px 0; text-align: right; border: 0; }
  table.stack td::before { content: attr(data-label); font-weight: 800; color: var(--slate); font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; text-align: left; flex-shrink: 0; }
  table.stack td[data-label=""]::before { display: none; }
  table.stack td:empty { display: none; }

  /* Calendrier : pastilles + liste du jour */
  .cal-month .cal-day { min-height: 56px; padding: 4px; text-align: center; }
  .cal-day-header { padding: 8px 2px; font-size: .62rem; }
  .cal-events { display: none; }
  .cal-dots { display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; margin-top: 3px; }
  .cal-dots b { font-size: .62rem; font-weight: 800; padding: 1px 5px; border-radius: 6px; }
  .cal-dots .d { background: #dbeafe; color: #1e40af; }
  .cal-dots .r { background: #fef3c7; color: #92400e; }
  .cal-day.sel { outline: 2px solid var(--gold-deep); outline-offset: -2px; }
  .cal-day-num { font-size: .8rem; margin-bottom: 0; text-align: center; }
  .cal-day.today .cal-day-num { margin: 0 auto; }
  .cal-title { min-width: 0; font-size: 1rem; }
  .cal-toolbar { gap: 8px; }
}
@media (min-width: 901px) {
  .rcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
  .sheet-foot { bottom: -28px; }
}


/* ═══ Nouvelle interface (écrans validés) ═══ */
:root { --dep: #2E7FD3; --dep-bg: #E8F1FC; --ret: #E5484D; --ret-bg: #FDECEC; }
.eyebrow { font-size: .68rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--slate); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.page-head h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
.ph-actions { display: flex; gap: 8px; }
.sqbtn { width: 46px; height: 46px; border-radius: 14px; background: #fff; border: 1px solid var(--line); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; }
.sqbtn svg { width: 20px; height: 20px; }
.sqbtn.primary { background: var(--gold-deep); border-color: var(--gold-deep); color: #fff; }

.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { background: #fff; border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 4px 9px; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--slate); }
.tile svg { width: 21px; height: 21px; }
.tile b { font-size: 1.45rem; font-weight: 800; color: var(--ink); line-height: 1.15; }
.tile span { font-size: .72rem; font-weight: 600; }
.tile:nth-child(1) svg { color: var(--dep); } .tile:nth-child(2) svg { color: var(--ret); } .tile:nth-child(4) svg { color: #10B981; }
.tile.on { border-color: var(--gold-deep); box-shadow: 0 0 0 1.5px var(--gold-deep) inset; }
.due { margin: 10px 2px 12px; color: var(--slate); font-size: .9rem; }
.due b { color: #B42318; font-weight: 800; }
.fchips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
.fchips::-webkit-scrollbar { display: none; }
.fchip { flex-shrink: 0; display: inline-flex; align-items: center; gap: 7px; padding: 10px 14px; border-radius: 100px; background: #EEF2F7; font-weight: 700; font-size: .86rem; color: var(--ink); border: 1.5px solid transparent; white-space: nowrap; }
.fchip svg { width: 17px; height: 17px; color: var(--slate); }
.fchip .chv svg { width: 14px; height: 14px; transition: transform .15s; }
.fchip.on { background: var(--gold-pale); border-color: var(--gold); color: var(--gold-deep); }
.fchip.on svg { color: var(--gold-deep); }
.fchip.open .chv svg { transform: rotate(180deg); }
.chv { display: inline-flex; }
.fpanel { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; box-shadow: 0 6px 24px rgba(11,20,38,.06); }
.fp-title { display: flex; align-items: center; gap: 8px; font-weight: 800; margin-bottom: 10px; }
.fp-title svg { width: 18px; height: 18px; color: var(--gold-deep); }
.fp-x { margin-left: auto; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.fp-x svg { width: 18px !important; height: 18px !important; color: var(--muted) !important; }
.fopt { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 13px 14px; border-radius: 12px; border: 1.5px solid transparent; font-weight: 600; text-align: left; font-size: .95rem; }
.fopt svg { width: 18px; height: 18px; color: var(--gold-deep); }
.fopt.on { background: var(--gold-pale); border-color: var(--gold); color: var(--gold-deep); font-weight: 800; }

.grp-title { font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--slate); margin: 14px 2px 8px; display: flex; gap: 8px; align-items: center; }
.grp-title span { background: #E4ECF6; border-radius: 100px; padding: 1px 8px; }
.klist { display: flex; flex-direction: column; gap: 8px; }
.krow-wrap { background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.krow-wrap.open { border-color: var(--gold); box-shadow: 0 6px 20px rgba(46,127,211,.12); }
.krow-wrap.st-cancelled { opacity: .6; }
.krow-wrap.st-returned { opacity: .8; }
.krow { display: flex; align-items: center; gap: 11px; padding: 11px 12px; cursor: pointer; min-height: 62px; }
.krow-ico { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.krow-ico svg { width: 21px; height: 21px; }
.krow-ico.in { background: var(--dep-bg); color: var(--dep); }
.krow-ico.out { background: var(--ret-bg); color: var(--ret); }
.krow-ico.stock { background: #E7F7EF; color: #10B981; }
.krow-time { font-weight: 800; font-size: 1.08rem; letter-spacing: -.01em; min-width: 50px; line-height: 1.15; }
.krow-time small { display: block; font-size: .62rem; font-weight: 700; color: var(--slate); text-transform: uppercase; letter-spacing: .03em; }
.krow-main { flex: 1; min-width: 0; }
.krow-name { font-weight: 800; font-size: .98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.krow-tag { font-weight: 600; color: var(--muted); font-size: .84rem; }
.krow-sub { font-size: .82rem; color: var(--slate); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.krow-right { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
.krow-chev { color: var(--muted); display: inline-flex; }
.krow-chev svg { width: 16px; height: 16px; transition: transform .15s; }
.krow-wrap.open .krow-chev svg { transform: rotate(180deg); }
.amt { background: #FDECEC; color: #B42318; font-weight: 800; font-size: .8rem; border-radius: 100px; padding: 4px 9px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; color: #fff; font-weight: 800; font-size: .7rem; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.kexp { padding: 4px 14px 14px; border-top: 1px dashed var(--line); background: #FBFCFE; }
.kexp-badges { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.kv-grid { margin-top: 10px; }
.kv { display: flex; justify-content: space-between; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .88rem; }
.kv:last-child { border-bottom: 0; }
.kv span { color: var(--slate); font-weight: 600; flex-shrink: 0; }
.kv b { text-align: right; font-weight: 700; word-break: break-word; }
.kexp-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.carrow { display: flex; justify-content: space-between; gap: 8px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; font-weight: 700; font-size: .88rem; background: #fff; }

/* onglets en icônes */
.itabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 16px 0 12px; background: #EEF2F7; padding: 5px; border-radius: 16px; }
.itab { height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--slate); }
.itab svg { width: 24px; height: 24px; }
.itab.c-dep svg { color: var(--dep); } .itab.c-ret svg { color: var(--ret); } .itab.c-park svg { color: #10B981; }
.itab.on { background: #fff; box-shadow: 0 2px 10px rgba(11,20,38,.12); }
.itab.c-client.on svg { color: var(--gold-deep); }
.carcard, .paycard { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: #fff; margin-top: 12px; }
.cc-ico { width: 38px; height: 38px; border-radius: 11px; background: var(--gold-pale); color: var(--gold-deep); display: flex; align-items: center; justify-content: center; }
.cc-ico svg { width: 20px; height: 20px; }
.paycard { background: #FFF8EB; border-color: #F6D9A0; }
.paycard.paid { background: #EAF8F1; border-color: #A7E3C6; }
.paycard .btn { flex-shrink: 0; }
.linkbtn { color: var(--gold-deep); font-weight: 800; font-size: .88rem; padding: 8px 4px; flex-shrink: 0; }

/* nouvelle réservation */
.modal-bg.nf .modal-card { background: var(--bg); }
.ncard { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 12px; }
.ncard h3 { font-size: 1rem; font-weight: 800; margin-bottom: 12px; }
.ncard .field { margin-bottom: 10px; }
.ncard input:not([type=checkbox]), .ncard select, .ncard textarea { width: 100%; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; font-size: 16px; font-weight: 500; outline: none; min-height: 48px; }
.ncard input:focus, .ncard select:focus, .ncard textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(46,127,211,.14); }
.ncard .two { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; }
.ncard .two select { grid-column: auto; }

.dchip.on { border-style: solid; border-color: var(--gold); background: var(--gold-pale); color: var(--gold-deep); }

.eurofield span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--slate); font-weight: 800; }
.picked { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--gold-pale); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
.totalbar { position: sticky; bottom: -28px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #0F2E4C; color: #fff; padding: 12px 14px 12px 18px; border-radius: 18px; margin-top: 14px; z-index: 3; }
.totalbar span { display: block; font-size: .64rem; letter-spacing: .12em; color: rgba(255,255,255,.6); font-weight: 800; }

}

/* calendrier : retours en rouge, départs en bleu */

.cal-event.dep { border-left-color: var(--dep); }

.head-actions { display: flex; gap: 8px; flex-shrink: 0; align-items: center; }

</style>

  <!-- Main content -->

<!-- Modals container -->
<div id="modalsContainer"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════════════════════════════
   STATE & API
═══════════════════════════════════════════════════════════ */
const STATE = {
  token: localStorage.getItem('vo_token') || null,
  view: 'today',
  bookings: [],
  clients: [],
  rules: [],
  specials: [],
  blocks: [],
  promos: [],
  stats: null,
  calMode: 'month',     // month | week
  calDate: new Date(),
};

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (STATE.token) headers['Authorization'] = `Bearer ${STATE.token}`;
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 401) {
    logout();
    throw new Error('Session expirée');
  }
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `Erreur serveur (HTTP ${res.status} sur ${path})`);
  return json;
}

function toast(msg, type = 'info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  setTimeout(() => el.classList.remove('show'), 3000);
}

/* ════════════════════════════════════════════════════════════
   AUTH
═══════════════════════════════════════════════════════════ */
async function doLogin() {
  const password = document.getElementById('adminPass').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  try {
    const { token } = await api('/api/admin/login', {
      method: 'POST',
      body: JSON.stringify({ password }),
    });
    STATE.token = token;
    localStorage.setItem('vo_token', token);
    showApp();
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Se connecter';
  }
}

function logout() {
  STATE.token = null;
  localStorage.removeItem('vo_token');
  document.getElementById('app').classList.remove('show');
  document.getElementById('loginScreen').style.display = 'flex';
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('show');
  switchView('today');
}

/* ════════════════════════════════════════════════════════════
   ROUTING
═══════════════════════════════════════════════════════════ */
document.querySelectorAll('.sidebar-nav button[data-view], .bottom-nav button[data-view]').forEach(btn => {
  btn.addEventListener('click', () => {
    switchView(btn.dataset.view);
    toggleSidebar(false);
  });
});

function toggleSidebar(force) {
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebarBackdrop');
  const open = force !== undefined ? force : !sidebar.classList.contains('open');
  sidebar.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/admin/sw.js').catch(() => {});
  });
}

async function switchView(view) {
  STATE.view = view;
  document.querySelectorAll('.sidebar-nav button[data-view], .bottom-nav button[data-view]').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  window.scrollTo(0, 0);
  const container = document.getElementById('viewContainer');
  container.innerHTML = '<div class="loading"><span class="spinner"></span> Chargement…</div>';

  try {
    if (view === 'today') await renderToday();
    else if (view === 'valets') await renderValets();
    else if (view === 'autos') await renderAutos();
    else if (view === 'dashboard') await renderDashboard();
    else if (view === 'calendar') await renderCalendar();
    else if (view === 'bookings') await renderBookings();
    else if (view === 'clients') await renderClients();
    else if (view === 'pricing') await renderPricing();
    else if (view === 'promos') await renderPromos();
    else if (view === 'categories') await renderCategories();
    else if (view === 'surcharges') await renderSurcharges();
    else if (view === 'quotes') await renderQuotes();
    else if (view === 'templates') await renderTemplates();
    else if (view === 'settings') await renderSettings();
  } catch (err) {
    container.innerHTML = `<div class="empty"><p>Erreur : ${err.message}</p></div>`;
  }
}

/* ════════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════ */
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtDateLong(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
}
function fmtMonth(d) {
  return d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
}
function todayISO() { return localISO(); }
function statusLabel(s) {
  return ({
    pending: 'En attente',
    confirmed: 'Confirmée',
    taken: 'Prise en charge',
    in_storage: 'En stock',
    returned: 'Restituée',
    cancelled: 'Annulée',
  })[s] || s;
}
function statusBadge(s) {
  return `<span class="badge badge-${s}"><span class="dot"></span>${statusLabel(s)}</span>`;
}
function washLabel(t) {
  return ({
    none: 'Aucun', exterieur: 'Extérieur', interieur: 'Intérieur',
    complet: 'Complet', premium: 'Premium',
  })[t] || '—';
}
function categoryLabel(code) {
  return ({
    citadine: 'Citadine', berline: 'Berline / Break',
    suv: 'SUV / Familial / Monospace', utilitaire: 'Van / Utilitaire',
  })[code] || code || '—';
}

/* ════════════════════════════════════════════════════════════
   VIEW: DASHBOARD
═══════════════════════════════════════════════════════════ */
async function renderDashboard() {
  const { stats } = { stats: await api('/api/admin/stats') };
  STATE.stats = stats;
  const c = document.getElementById('viewContainer');
  c.innerHTML = `
    <div class="topbar">
      <div>
        <h1>Tableau de bord</h1>
        <p class="sub">Vue d'ensemble de l'activité — ${fmtDateLong(todayISO())}</p>
      </div>
      <button class="btn btn-gold" onclick="openBookingForm()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Nouvelle réservation
      </button>
    </div>

    <div class="stats-grid">
      <div class="stat gold">
        <div class="stat-label">Revenus du mois</div>
        <div class="stat-val">${stats.month_revenue}<span class="cur">€</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">Total réservations</div>
        <div class="stat-val">${stats.total_bookings}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Départs aujourd'hui</div>
        <div class="stat-val">${stats.today_departures}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Retours aujourd'hui</div>
        <div class="stat-val">${stats.today_returns}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Voitures en stock</div>
        <div class="stat-val">${stats.in_storage}</div>
      </div>
    </div>

    <div class="card card-pad-0">
      <div style="padding:18px 22px; border-bottom: 1px solid var(--line); display:flex; justify-content:space-between; align-items:center;">

function localISO(d) {
  d = d || new Date();
  const z = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
}
function addDays(iso, n) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return localISO(d);
}
function mondayOf(iso) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return localISO(d);
}
function fmtDM(iso) {
  if (!iso) return '';
  return new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
}
function fmtLongDay(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}
const hm = t => (t ? String(t).slice(0, 5) : '');

const eur = n => (Math.round(Number(n || 0) * 100) / 100).toString().replace('.', ',') + ' €';

  if (n.startsWith('+')) n = n.slice(1);
  else if (n.startsWith('00')) n = n.slice(2);
  else if (n.startsWith('0')) n = '33' + n.slice(1);
  return 'https://wa.me/' + n;
}

/* Prochaine étape logique d'une réservation */
function nextAction(b, type) {
  const st = b.status;
  if (st === 'cancelled' || st === 'returned') return null;
  if (type === 'out' || st === 'in_storage') {
    if (st === 'taken' || st === 'in_storage') return { label: '✓ Valider la restitution', status: 'returned' };
    return { label: '✓ Valider la prise en charge', status: 'taken' };
  }
  if (st === 'pending' || st === 'confirmed') return { label: '✓ Valider la prise en charge', status: 'taken' };
  if (st === 'taken') return { label: '🅿️ Mettre en stock', status: 'in_storage' };
  return null;
}

/* ════════════════════════════════════════════════════════════

═══════════════════════════════════════════════════════════ */
const TD_DEFAULT = () => ({
  mode: 'today', day: localISO(), from: localISO(), to: localISO(), weekStart: mondayOf(localISO()),
  tab: 'all', status: 'default', sort: 'time_asc', group: 'mixed', valet: '', panel: null, q: '', search: false,
});
STATE.td = TD_DEFAULT();

function tdRange() {
  const t = STATE.td, today = localISO();
  if (t.mode === 'today') return [today, today];
  if (t.mode === 'tomorrow') { const x = addDays(today, 1); return [x, x]; }
  if (t.mode === 'week') return [t.weekStart, addDays(t.weekStart, 6)];
  if (t.mode === 'day') return [t.day, t.day];
  const f = t.from || today, to = t.to || f;
  return f <= to ? [f, to] : [to, f];
}
function statusMatch(b, key) {
  if (key === 'all') return b.status !== 'cancelled';
  if (key === 'upcoming') return b.status === 'pending' || b.status === 'confirmed';
  if (key === 'onsite') return b.status === 'taken' || b.status === 'in_storage';
  return b.status === key;
}
function tdItems(tab) {
  const t = STATE.td;
  const [from, to] = tdRange();
  const key = t.status === 'default' ? (tab === 'stock' ? 'onsite' : 'all') : t.status;
  const all = STATE.all || [];
  const items = [];
  if (tab === 'in' || tab === 'all') all.forEach(b => { if (statusMatch(b, key) && b.departure_date >= from && b.departure_date <= to) items.push({ b, type: 'in', k: b.departure_date + hm(b.departure_time) }); });
  if (tab === 'out' || tab === 'all') all.forEach(b => { if (statusMatch(b, key) && b.return_date >= from && b.return_date <= to) items.push({ b, type: 'out', k: b.return_date + hm(b.return_time) }); });
  if (tab === 'stock') all.forEach(b => { if (statusMatch(b, key) && b.departure_date <= to && b.return_date >= from) items.push({ b, type: 'stock', k: b.return_date + hm(b.return_time) }); });

  let res = items;
  if (t.valet) {
    res = res.filter(it => {
      const a = STATE.ops?.assignments?.[it.b.reference] || {};
      const leg = it.type === 'out' ? a.ret : it.type === 'in' ? a.dep : (a.dep || a.ret);
      return t.valet === 'none' ? !leg : (it.type === 'stock' ? (a.dep === t.valet || a.ret === t.valet) : leg === t.valet);
    });
  }
  const q = t.q.trim().toLowerCase();
  if (q) {
    const pq = q.replace(/[\s-]/g, '');
    res = res.filter(({ b }) => [b.customer_firstname, b.customer_lastname, b.reference, b.car_brand, b.car_model].some(x => String(x || '').toLowerCase().includes(q))
      || String(b.car_plate || '').toLowerCase().replace(/[\s-]/g, '').includes(pq)
      || String(b.customer_phone || '').replace(/\s/g, '').includes(q.replace(/\s/g, '')));
  }
  const sorters = {
    time_asc: (a, b) => a.k.localeCompare(b.k),
    time_desc: (a, b) => b.k.localeCompare(a.k),
    alpha: (a, b) => (a.b.customer_lastname + a.b.customer_firstname).localeCompare(b.b.customer_lastname + b.b.customer_firstname, 'fr'),
    amount: (a, b) => ((b.b.payment_status === 'paid' ? 0 : Number(b.b.total_price)) - (a.b.payment_status === 'paid' ? 0 : Number(a.b.total_price))) || a.k.localeCompare(b.k),
  };
  return res.sort(sorters[t.sort] || sorters.time_asc);
}

function tdSet(patch) { Object.assign(STATE.td, patch); STATE.openRow = null; paintToday(); }

function paintBookings(full) {
  const f = STATE.bk;
  const needle = f.q.trim().toLowerCase();
  const plateNeedle = needle.replace(/[\s-]/g, '');
  const rows = (STATE.all || []).filter(b => {
    if (f.status !== 'all' && !statusMatch(b, f.status)) return false;
    if (f.from && b.return_date < f.from) return false;
    if (f.to && b.departure_date > f.to) return false;
    if (!needle) return true;
    return [b.reference, b.customer_firstname, b.customer_lastname, b.customer_email, b.car_brand, b.car_model]
      .some(x => String(x || '').toLowerCase().includes(needle))
      || String(b.customer_phone || '').replace(/\s/g, '').includes(needle.replace(/\s/g, ''))
      || String(b.car_plate || '').toLowerCase().replace(/[\s-]/g, '').includes(plateNeedle);
  }).sort((a, b) => (b.departure_date + hm(b.departure_time)).localeCompare(a.departure_date + hm(a.departure_time)));

  const chips = [['all', 'Toutes'], ['upcoming', 'À venir'], ['taken', 'Pris en charge'], ['in_storage', 'En stock'], ['returned', 'Rendues'], ['cancelled', 'Annulées']];
  const c = document.getElementById('viewContainer');
  if (full === true || !document.getElementById('bkList')) {
    c.innerHTML = `
      <div class="page-head">
        <div><div class="eyebrow" id="bkCount"></div><h1>Réservations</h1></div>
        <div class="ph-actions"><button class="sqbtn primary" onclick="openBookingForm()" aria-label="Nouvelle réservation">${IC.plus}</button></div>
      </div>
      <div class="field" style="margin-bottom:10px;"><input type="search" id="bkSearch" placeholder="Nom, référence, plaque, téléphone…" value="${escapeHtml(f.q)}" oninput="STATE.bk.q=this.value;paintBookings()"></div>
      <div class="chips">${chips.map(([k, l]) => `<button class="chip ${f.status === k ? 'on' : ''}" onclick="STATE.bk.status='${k}';paintBookings(true)">${l}</button>`).join('')}</div>
      <div class="datebar" style="padding:10px 12px;"><div class="row">
        <input type="date" value="${f.from}" onchange="STATE.bk.from=this.value;paintBookings(true)" aria-label="Du"><span class="text-muted">→</span>
        <input type="date" value="${f.to}" onchange="STATE.bk.to=this.value;paintBookings(true)" aria-label="Au">
        ${(f.from || f.to) ? `<button class="roundbtn" onclick="STATE.bk.from='';STATE.bk.to='';paintBookings(true)" aria-label="Effacer">${IC.close}</button>` : ''}</div></div>
      <div id="bkList"></div>`;

  document.getElementById('bkCount').textContent = `${rows.length} réservation(s)`;
  document.getElementById('bkList').innerHTML = rows.length === 0
    ? '<div class="card"><div class="empty" style="padding:30px 10px;"><p>Aucune réservation trouvée</p></div></div>'
    : `<div class="klist">${rows.slice(0, 150).map(b => krowHTML({ b, type: 'in' }, { showDate: true })).join('')}</div>` + (rows.length > 150 ? '<p class="text-muted" style="text-align:center;margin-top:12px;">150 premières affichées — affine la recherche.</p>' : '');
}

    const v = x.v ?? x, l = x.l ?? x;
    return `<option value="${escapeHtml(v)}"${v === cur ? ' selected' : ''}>${escapeHtml(l)}</option>`;

/* Changement de statut / paiement depuis la fiche : on enregistre aussi les champs modifiés */
async function bdAct(status) {
  if (status === 'cancelled' && !confirm('Annuler cette réservation ?')) return;
  await bdSave({ status });
}
async function bdPay(method) {
  await bdSave(method ? { payment_status: 'paid', payment_method: method } : { payment_status: 'pending' });
}

async function bdSave(extra) {
  const b = bdBooking();
  if (!b) return;
  const v = k => document.getElementById('bd-' + k).value.trim();
  const updates = {
    customer_firstname: v('fn'), customer_lastname: v('ln'), customer_email: v('em').toLowerCase(),
    customer_phone: v('ph'), customer_flight: v('fl'),
    departure_date: v('dd'), departure_time: v('dt'), departure_terminal: v('dterm'),
    return_date: v('rd'), return_time: v('rt'), return_terminal: v('rterm'),
    car_brand: v('cb'), car_model: v('cm'), car_color: v('cc'), car_plate: v('cp').toUpperCase(),
    car_category_code: v('cat'), wash_type: v('wash'),
    has_covered_parking: document.getElementById('bd-cov').checked,
    has_priority_access: document.getElementById('bd-pri').checked,
    parking_spot: v('spot'), internal_notes: document.getElementById('bd-notes').value.trim(),
    ...extra,
  };
  if (!updates.customer_firstname || !updates.customer_phone) return toast('Prénom et téléphone sont obligatoires', 'error');
  if (!updates.departure_date || !updates.return_date || !updates.departure_time || !updates.return_time) return toast('Dates et heures obligatoires', 'error');
  if (updates.return_date < updates.departure_date) return toast('Le retour est avant le départ', 'error');
  if (!updates.car_plate) return toast('La plaque est obligatoire', 'error');
  const recalc = document.getElementById('bd-recalc').checked;
  if (!recalc) {
    const total = Number(v('total'));
    if (!isFinite(total) || total < 0) return toast('Prix invalide', 'error');
    updates.total_price = total;
  }
  try {
    const { booking } = await api(`/api/admin/bookings?id=${b.id}${recalc ? '&recalc=1' : ''}`, { method: 'PATCH', body: JSON.stringify(updates) });
    applyBooking(booking);
    toast(extra.status ? statusLabel(extra.status) : extra.payment_status ? 'Paiement mis à jour' : 'Réservation enregistrée', 'success');
    repaint();
    if (Object.keys(extra).length) drawBookingDetail(booking);   // on reste dans la fiche
    else closeModal();
  } catch (err) { toast(err.message, 'error'); }
}

async function deleteBooking(id) {

const normPlate = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const normPhone = s => String(s || '').replace(/[^\d]/g, '').replace(/^33/, '0');
const TWO_WORD_BRANDS = ['land rover', 'alfa romeo', 'aston martin', 'mercedes benz', 'rolls royce', 'ds automobiles'];
function splitCar(txt) {
  const t = String(txt || '').trim().replace(/\s+/g, ' ');
  const low = t.toLowerCase();
  const two = TWO_WORD_BRANDS.find(b => low.startsWith(b + ' ') || low === b);
  if (two) return { brand: t.slice(0, two.length), model: t.slice(two.length).trim() };
  const i = t.indexOf(' ');
  return i < 0 ? { brand: t, model: '' } : { brand: t.slice(0, i), model: t.slice(i + 1) };
}
function splitName(txt) {
  const t = String(txt || '').trim().replace(/\s+/g, ' ');
  const i = t.indexOf(' ');
  return i < 0 ? { first: t, last: '' } : { first: t.slice(0, i), last: t.slice(i + 1) };
}

function nfReveal(k) {
  const blk = document.getElementById('nf-blk-' + k);
  const chip = document.getElementById('nf-chip-' + k);
  const show = blk.style.display === 'none';
  blk.style.display = show ? 'block' : 'none';
  chip.classList.toggle('on', show);
  if (show) blk.querySelector('input,select,textarea')?.focus();
}

function nfSearch(q) {
  const box = document.getElementById('nf-results');
  const n = q.trim().toLowerCase();
  if (n.length < 2) { box.innerHTML = ''; return; }
  const digits = normPhone(q), plate = normPlate(q);
  const byPlate = new Set();
  if (plate.length >= 3) (STATE.all || []).forEach(b => { if (normPlate(b.car_plate).includes(plate) && b.client_id) byPlate.add(b.client_id); });
  const found = (STATE.clients || []).filter(c =>
    `${c.firstname} ${c.lastname}`.toLowerCase().includes(n) || `${c.lastname} ${c.firstname}`.toLowerCase().includes(n)
    || String(realEmail(c.email)).toLowerCase().includes(n)
    || (digits.length >= 4 && normPhone(c.phone).includes(digits))
    || byPlate.has(c.id)).slice(0, 6);
  box.innerHTML = found.length === 0
    ? '<div class="text-muted" style="padding:10px 2px;font-size:.84rem;">Aucun client trouvé : remplis les champs ci-dessous, il sera créé automatiquement.</div>'
    : `<div class="search-results">${found.map(c => `<button type="button" onclick="nfPickClient('${c.id}')"><strong>${escapeHtml(c.firstname)} ${escapeHtml(c.lastname)}</strong> ${c.is_vip ? '⭐' : ''}<br><span class="text-muted">${escapeHtml(c.phone || '')} · ${c.total_bookings || 0} résa(s)</span></button>`).join('')}</div>`;
}

async function nfPickClient(id) {
  try {
    const { client, bookings } = await api('/api/admin/clients?id=' + id);
    const set = (k, v) => { const el = document.getElementById('nf-' + k); if (el) el.value = v ?? ''; };
    const full = `${client.firstname} ${client.lastname}`.trim();
    set('name', full); set('phone', client.phone);
    const em = realEmail(client.email);
    if (em) { set('email', em); document.getElementById('nf-blk-email').style.display = 'block'; document.getElementById('nf-chip-email').classList.add('on'); }
    const withFlight = bookings.find(b => b.customer_flight);
    if (withFlight) { set('flight', withFlight.customer_flight); document.getElementById('nf-blk-flight').style.display = 'block'; document.getElementById('nf-chip-flight').classList.add('on'); }
    const seen = new Set(), cars = [];
    for (const b of bookings) {
      const k = normPlate(b.car_plate);
      if (!k || seen.has(k)) continue;
      seen.add(k);
      cars.push({ brand: b.car_brand, model: b.car_model, color: b.car_color, plate: b.car_plate, cat: b.car_category_code });
    }
    STATE.nf.clientId = client.id; STATE.nf.cars = cars; STATE.nf.names = { full, first: client.firstname, last: client.lastname };
    document.getElementById('nf-results').innerHTML = '';
    document.getElementById('nf-search').value = '';
    document.getElementById('nf-picked').innerHTML = `<div class="picked"><div><strong>✓ ${escapeHtml(full)}</strong> ${client.is_vip ? '⭐' : ''}<div class="text-muted text-tiny">Client connu · ${client.total_bookings || 0} résa(s)${client.notes ? ' · ' + escapeHtml(client.notes) : ''}</div></div><button type="button" class="linkbtn" onclick="nfClearClient()">Changer</button></div>`;
    if (cars.length) nfPickCar(0); else nfCarsHTML(-1);
    nfPrice();
  } catch (err) { toast(err.message, 'error'); }
}
function nfClearClient() {
  STATE.nf.clientId = null; STATE.nf.cars = []; STATE.nf.names = null;
  document.getElementById('nf-picked').innerHTML = '';
  ['name', 'phone', 'email', 'flight'].forEach(k => document.getElementById('nf-' + k).value = '');

function nfCarsHTML(sel) {

function nfFoot() {

  el.textContent = n == null || isNaN(n) ? '—' : eur(n);

let nfTimer = null;
function nfPrice() {
  const d1 = document.getElementById('nf-dd')?.value, d2 = document.getElementById('nf-rd')?.value;
  const du = document.getElementById('nf-duree');
  if (du && d1 && d2) {
    const n = Math.round((new Date(d2 + 'T12:00:00') - new Date(d1 + 'T12:00:00')) / 86400000);
    du.innerHTML = n < 0 ? '<span class="text-error">Le retour est avant le départ</span>' : `Durée : <b>${n} jour${n > 1 ? 's' : ''}</b>`;
  }
  clearTimeout(nfTimer);
  nfTimer = setTimeout(async () => {
    const el = document.getElementById('nf-price');
    if (!el) return;
    const g = k => document.getElementById('nf-' + k)?.value;
    if (!g('dd') || !g('rd') || g('rd') < g('dd')) { STATE.nf.calc = null; nfFoot(); return; }
    try {
      const p = await fetch('/api/pricing', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          depDate: g('dd'), depTime: g('dt') || '08:00', retDate: g('rd'), retTime: g('rt') || '20:00',
          carCategoryCode: g('cat'), washType: g('wash'),
          hasCoveredParking: document.getElementById('nf-cov').checked, hasPriorityAccess: document.getElementById('nf-pri').checked,
          promoCode: (g('promo') || '').toUpperCase() || undefined, customerEmail: g('email') || undefined,
        }),
      }).then(r => r.json());
      if (!document.getElementById('nf-price')) return;
      if (p.dateBlocked) { STATE.nf.calc = null; el.innerHTML = '<span class="text-error text-bold">⚠ Dates bloquées dans les tarifs (tu peux quand même créer la résa).</span>'; nfFoot(); return; }
      if (p.error) { el.textContent = p.error; return; }
      STATE.nf.calc = p.total;
      if (!STATE.nf.priceTouched) document.getElementById('nf-total').value = '';
      el.innerHTML = `Prix calculé <b>${eur(p.total)}</b> · ${p.days} jour(s)${p.vehicleSurcharge > 0 ? ' · catégorie +' + eur(p.vehicleSurcharge) : ''}${p.washPrice > 0 ? ' · lavage ' + eur(p.washPrice) : ''}${p.timeSurcharges > 0 ? ' · horaires +' + eur(p.timeSurcharges) : ''}${p.promoDiscount > 0 ? ' · promo −' + eur(p.promoDiscount) : ''}${p.promoRejectedReason ? ' <span class="text-error">· code promo non appliqué</span>' : ''}<br><span class="text-tiny">Tape un montant dans la case pour imposer un autre prix.</span>`;
      nfFoot();
    } catch { el.textContent = 'Le prix sera calculé à la création'; }
  }, 350);
}

async function submitNewBooking() {
  const g = k => (document.getElementById('nf-' + k)?.value || '').trim();
  const nm = STATE.nf.names && STATE.nf.names.full === g('name') ? { first: STATE.nf.names.first, last: STATE.nf.names.last } : splitName(g('name'));
  const car = splitCar(g('car'));
  if (!nm.first) return toast('Nom obligatoire', 'error');
  if (!g('phone')) return toast('Téléphone obligatoire', 'error');
  if (!g('plate')) return toast('Plaque obligatoire', 'error');
  if (!car.brand) return toast('Marque & modèle obligatoires', 'error');
  if (!g('dd') || !g('rd')) return toast('Dates obligatoires', 'error');
  if (g('rd') < g('dd')) return toast('Le retour est avant le départ', 'error');
  const btn = document.getElementById('nf-submit');
  btn.disabled = true;
  const [ps, pm] = g('pay').split('|');
  const payload = {
    customer: { firstname: nm.first, lastname: nm.last, email: g('email'), phone: g('phone'), flight: g('flight') },
    car: { brand: car.brand, model: car.model, color: g('color'), plate: g('plate').toUpperCase(), categoryCode: g('cat') },
    departure: { date: g('dd'), time: g('dt') || '08:00', terminal: g('dterm') },
    return: { date: g('rd'), time: g('rt') || '20:00', terminal: g('rterm') },
    wash: { type: g('wash') || 'none' },
    options: { coveredParking: document.getElementById('nf-cov').checked, priorityAccess: document.getElementById('nf-pri').checked },
    promoCode: g('promo').toUpperCase() || undefined,
    status: 'confirmed', payment_method: pm, payment_status: ps, internal_notes: g('note'),
  };
  if (g('total') !== '') payload.total_price = Number(g('total'));
  try {
    const { booking } = await api('/api/admin/bookings', { method: 'POST', body: JSON.stringify(payload) });
    for (const [leg, id] of [['dep', g('vdep')], ['ret', g('vret')]]) {
      if (id) { try { const r = await api('/api/admin/ops', { method: 'POST', body: JSON.stringify({ action: 'assign', reference: booking.reference, leg, valet_id: id }) }); STATE.ops.assignments = r.assignments; } catch {} }
    }
    toast('Réservation créée', 'success');
    await loadAll(true);
    STATE.clients = null;
    closeModal();
    repaint();
    openBookingDetail(booking.reference);
  } catch (err) { toast(err.message, 'error'); btn.disabled = false; }
}

STATE.cl = { q: '', f: 'all' };

async function renderClients() {
  const [{ clients }] = await Promise.all([api('/api/admin/clients'), loadAll(true), loadOps(true)]);
  STATE.clients = clients || [];
  STATE.repaint = paintClients;
  paintClients(true);
}
function clientStats(c) {
  const today = localISO();
  const bs = (STATE.all || []).filter(b => b.client_id === c.id && b.status !== 'cancelled');
  const past = bs.filter(b => b.return_date < today).map(b => b.return_date).sort();
  const next = bs.filter(b => b.departure_date >= today).map(b => b.departure_date).sort()[0] || null;
  const current = bs.some(b => b.departure_date <= today && b.return_date >= today);
  return { last: past[past.length - 1] || null, next, current, n: bs.length };
}
function paintClients(full) {
  const f = STATE.cl;
  const needle = f.q.trim().toLowerCase();
  const digits = normPhone(f.q), plate = normPlate(f.q);
  const plates = new Map();
  if (plate.length >= 3) (STATE.all || []).forEach(b => { if (b.client_id && normPlate(b.car_plate).includes(plate)) plates.set(b.client_id, true); });
  const today = localISO();
  const limit = addDays(today, -90);
  let rows = (STATE.clients || []).map(c => ({ c, s: clientStats(c) })).filter(({ c, s }) => {
    if (f.f === 'vip' && !c.is_vip) return false;
    if (f.f === 'regular' && s.n < 2) return false;
    if (f.f === 'relance' && !(s.last && s.last < limit && !s.next && !s.current)) return false;
    if (!needle) return true;
    return `${c.firstname} ${c.lastname}`.toLowerCase().includes(needle) || `${c.lastname} ${c.firstname}`.toLowerCase().includes(needle)
      || String(realEmail(c.email)).toLowerCase().includes(needle) || (digits.length >= 4 && normPhone(c.phone).includes(digits)) || plates.has(c.id);
  });
  rows.sort((a, b) => (b.s.next || b.s.last || '').localeCompare(a.s.next || a.s.last || ''));

  const chips = [['all', 'Tous'], ['vip', '⭐ VIP'], ['regular', 'Réguliers (2+)'], ['relance', 'À relancer (+90 j)']];
  const c0 = document.getElementById('viewContainer');
  if (full === true || !document.getElementById('clList')) {
    c0.innerHTML = `
      <div class="page-head"><div><div class="eyebrow" id="clCount"></div><h1>Clients</h1></div>
        <div class="ph-actions"><button class="sqbtn primary" onclick="openBookingForm()" aria-label="Nouvelle réservation">${IC.plus}</button></div></div>
      <div class="field" style="margin-bottom:10px;"><input id="clSearch" type="search" placeholder="Nom, téléphone, email, plaque…" value="${escapeHtml(f.q)}" oninput="STATE.cl.q=this.value;paintClients()"></div>
      <div class="chips">${chips.map(([k, l]) => `<button class="chip ${f.f === k ? 'on' : ''}" onclick="STATE.cl.f='${k}';paintClients(true)">${l}</button>`).join('')}</div>
      <div id="clList"></div>`;
    if (needle) { const el = document.getElementById('clSearch'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
  document.getElementById('clCount').textContent = `${rows.length} client(s)`;
  document.getElementById('clList').innerHTML = rows.length === 0
    ? '<div class="card"><div class="empty" style="padding:30px 10px;"><p>Aucun client</p></div></div>'
    : `<div class="klist">${rows.slice(0, 200).map(({ c, s }) => `
      <div class="krow-wrap"><div class="krow" onclick="openClientDetail('${c.id}')">
        <div class="krow-ico" style="background:var(--gold-pale);color:var(--gold-deep);font-weight:800;font-size:.8rem;">${escapeHtml(initials(c.firstname + ' ' + c.lastname))}</div>
        <div class="krow-main"><div class="krow-name">${escapeHtml(c.firstname)} ${escapeHtml(c.lastname)} ${c.is_vip ? '⭐' : ''}</div>
          <div class="krow-sub">${escapeHtml(c.phone || '')} · ${s.n} résa(s) · ${eur(c.total_spent)}</div></div>
        <div class="krow-right">${s.current ? '<span class="pill paid">Chez nous</span>' : s.next ? `<span class="pill blue">Prochaine ${fmtDM(s.next)}</span>` : s.last ? `<span class="pill">Vu ${fmtDM(s.last)}</span>` : ''}<span class="krow-chev">${IC.right}</span></div>
      </div></div>`).join('')}</div>`;
}

async function saveClient(id) {
  try {
    const g = k => document.getElementById('cl-' + k).value.trim();
    const updates = { firstname: g('firstname'), lastname: g('lastname'), phone: g('phone'), is_vip: document.getElementById('cl-vip').checked, notes: g('notes') };
    if (g('email')) updates.email = g('email');
    if (!updates.firstname || !updates.phone) return toast('Prénom et téléphone obligatoires', 'error');
    await api('/api/admin/clients?id=' + id, { method: 'PATCH', body: JSON.stringify(updates) });
    toast('Client mis à jour', 'success');
    closeModal();
    if (STATE.view === 'clients') renderClients();
  } catch (err) { toast(err.message, 'error'); }

async function deleteClient(id) {
  try {
    await api('/api/admin/clients?id=' + id, { method: 'DELETE' });
    toast('Client supprimé', 'success');
    closeModal();
    if (STATE.view === 'clients') renderClients();
  } catch (err) { toast(err.message, 'error'); }
}

function paintAutos() {

function autoInsert(code, v) {
  const ta = document.getElementById('at-body-' + code);
  const s = ta.selectionStart ?? ta.value.length;
  ta.value = ta.value.slice(0, s) + `{{${v}}}` + ta.value.slice(ta.selectionEnd ?? s);
  ta.focus(); ta.setSelectionRange(s + v.length + 4, s + v.length + 4);
}
async function autoCall(body, ok) {
  try {
    const r = await api('/api/admin/ops', { method: 'POST', body: JSON.stringify(body) });
    if (r.templates) STATE.ops.templates = r.templates;
    if (ok) toast(typeof ok === 'function' ? ok(r) : ok, 'success');
    return r;
  } catch (err) { toast(err.message, 'error'); return null; }
}
async function autoMaster(on) {
  if (on && !confirm("Activer les envois automatiques ? Les emails cochés partiront aux vrais clients dès ce soir.")) return paintAutos();
  const r = await autoCall({ action: 'master', enabled: on }, on ? 'Envois automatiques activés' : 'Envois automatiques éteints');
  if (r) STATE.ops.enabled = r.enabled;
  paintAutos();
}
async function autoToggle(code, on) {
  const r = await autoCall({ action: 'template', code, active: on }, on ? 'Activé' : 'Désactivé');
  if (r) paintAutos();
}
async function autoSave(code) {
  const r = await autoCall({ action: 'template', code, subject: document.getElementById('at-subj-' + code).value, body: document.getElementById('at-body-' + code).value }, 'Email enregistré');
  if (r) paintAutos();
}
async function autoReset(code) {
  if (!confirm('Remettre le texte recommandé ? (ton texte actuel sera remplacé)')) return;
  const r = await autoCall({ action: 'template', code, reset: true }, 'Texte recommandé remis');
  if (r) paintAutos();
}
async function autoTest(code) {
  await autoCall({ action: 'test', code }, r => 'Test envoyé à ' + r.to);
}

function openPricingForm(type, id) {
