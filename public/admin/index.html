<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Back-office — Direct Voiturier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --gold: #E8B362;
  --gold-deep: #C9913B;
  --gold-pale: #FBF3E0;
  --ink: #0B1426;
  --ink-soft: #1a2338;
  --slate: #4a5576;
  --muted: #94a3b8;
  --line: #e5e7eb;
  --bg: #f8fafc;
  --success: #10b981;
  --warning: #f59e0b;
  --error: #ef4444;
  --info: #3b82f6;
}
body {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; }

/* ── Login ── */
.login-screen {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #0B1426 0%, #2d1f47 50%, #75234a 100%);
  padding: 20px;
}
.login-box {
  background: white;
  border-radius: 22px;
  padding: 40px 36px;
  width: 100%; max-width: 380px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.4);
}
.login-box .logo {
  display: flex; align-items: center; gap: 10px; justify-content: center;
  margin-bottom: 24px;
}
.login-box .logo-mark {
  width: 40px; height: 40px;
  background: var(--gold); border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
}
.login-box .logo-mark svg { width: 22px; height: 22px; color: var(--ink); }
.login-box h1 { font-size: 1.4rem; font-weight: 800; }
.login-box .sub { font-size: 0.86rem; color: var(--slate); }
.login-box label { display:block; font-size: 0.78rem; font-weight: 700; color: var(--slate); margin: 18px 0 6px; }
.login-box input {
  width: 100%; padding: 13px 14px; background: var(--bg);
  border: 1.5px solid transparent; border-radius: 10px;
  font-size: 0.95rem; font-weight: 600; outline: none;
  transition: all 0.2s;
}
.login-box input:focus { border-color: var(--gold); background: white; }
.login-box button {
  width: 100%; margin-top: 18px;
  padding: 13px;
  background: var(--ink); color: white;
  border-radius: 100px;
  font-weight: 700; font-size: 0.95rem;
  transition: all 0.2s;
}
.login-box button:hover { transform: translateY(-1px); background: var(--gold-deep); color: var(--ink); }
.login-error { color: var(--error); font-size: 0.82rem; margin-top: 12px; font-weight: 600; }

/* ── Layout ── */
.app { display: none; min-height: 100vh; }
.app.show { display: flex; }
.sidebar {
  width: 240px;
  background: var(--ink);
  color: white;
  display: flex; flex-direction: column;
  position: fixed; left: 0; top: 0; bottom: 0;
  z-index: 50;
  transition: transform 0.3s;
}
.sidebar-head {
  padding: 22px 20px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.sidebar-head .logo-mark {
  width: 34px; height: 34px;
  background: var(--gold); border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}
.sidebar-head .logo-mark svg { width: 18px; height: 18px; color: var(--ink); }
.sidebar-head .name { font-weight: 800; font-size: 1rem; }
.sidebar-head .tag { font-size: 0.62rem; color: var(--gold); letter-spacing: 0.16em; text-transform: uppercase; }
.sidebar-nav { flex: 1; padding: 12px 10px; }
.sidebar-nav button {
  width: 100%;
  padding: 11px 14px;
  display: flex; align-items: center; gap: 12px;
  color: rgba(255,255,255,0.7);
  font-size: 0.9rem; font-weight: 600;
  border-radius: 10px;
  margin-bottom: 3px;
  transition: all 0.2s;
  text-align: left;
}
.sidebar-nav button svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-nav button:hover { background: rgba(255,255,255,0.06); color: white; }
.sidebar-nav button.active { background: var(--gold); color: var(--ink); }
.sidebar-foot { padding: 14px; border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-foot button {
  width: 100%; padding: 10px; color: rgba(255,255,255,0.6);
  font-size: 0.84rem; font-weight: 600;
  display: flex; align-items: center; gap: 10px;
}
.sidebar-foot button:hover { color: white; }
.sidebar-foot svg { width: 16px; height: 16px; }

.main {
  flex: 1; margin-left: 240px;
  padding: 28px 36px;
  min-height: 100vh;
}

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px; flex-wrap: wrap; gap: 16px;
}
.topbar h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }
.topbar .sub { font-size: 0.86rem; color: var(--slate); margin-top: 2px; }

.btn {
  padding: 10px 18px;
  border-radius: 100px;
  font-size: 0.84rem; font-weight: 700;
  display: inline-flex; align-items: center; gap: 8px;
  transition: all 0.2s;
}
.btn svg { width: 14px; height: 14px; }
.btn-primary { background: var(--ink); color: white; }
.btn-primary:hover { background: var(--gold-deep); color: var(--ink); transform: translateY(-1px); }
.btn-gold { background: var(--gold); color: var(--ink); }
.btn-gold:hover { background: var(--gold-deep); }
.btn-ghost { background: white; color: var(--ink); border: 1.5px solid var(--line); }
.btn-ghost:hover { border-color: var(--gold); }
.btn-danger { background: var(--error); color: white; }
.btn-danger:hover { background: #dc2626; }
.btn-sm { padding: 7px 13px; font-size: 0.78rem; }

/* ── Cards ── */
.card {
  background: white;
  border-radius: 16px;
  border: 1px solid var(--line);
  padding: 20px;
  margin-bottom: 16px;
}
.card-pad-0 { padding: 0; overflow: hidden; }

/* ── Stats grid ── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.stat {
  background: white;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px 20px;
}
.stat-label {
  font-size: 0.7rem; font-weight: 700;
  color: var(--slate);
  letter-spacing: 0.1em; text-transform: uppercase;
  margin-bottom: 6px;
}
.stat-val {
  font-size: 1.8rem; font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.stat-val .cur { font-size: 1rem; color: var(--slate); margin-left: 2px; }
.stat-trend { font-size: 0.74rem; color: var(--success); margin-top: 4px; font-weight: 600; }
.stat.gold { background: linear-gradient(135deg, var(--gold-pale), white); border-color: var(--gold); }
.stat.gold .stat-val { color: var(--gold-deep); }

/* ── Tables ── */
.table-wrap { overflow-x: auto; border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
th, td { padding: 12px 14px; text-align: left; }
th {
  font-size: 0.7rem; font-weight: 700;
  color: var(--slate); letter-spacing: 0.08em;
  text-transform: uppercase;
  border-bottom: 2px solid var(--line);
  background: var(--bg);
  white-space: nowrap;
}
tbody tr { border-bottom: 1px solid var(--line); cursor: pointer; transition: background 0.15s; }
tbody tr:hover { background: var(--bg); }
tbody tr:last-child { border-bottom: none; }

/* ── Status badges ── */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px;
  border-radius: 100px;
  font-size: 0.72rem; font-weight: 700;
  white-space: nowrap;
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; }
.badge-pending     { background: #fef3c7; color: #92400e; }
.badge-pending .dot { background: #f59e0b; }
.badge-confirmed   { background: #dbeafe; color: #1e40af; }
.badge-confirmed .dot { background: #3b82f6; }
.badge-taken       { background: #ede9fe; color: #5b21b6; }
.badge-taken .dot  { background: #8b5cf6; }
.badge-in_storage  { background: #d1fae5; color: #065f46; }
.badge-in_storage .dot { background: #10b981; }
.badge-returned    { background: #f3f4f6; color: #374151; }
.badge-returned .dot { background: #6b7280; }
.badge-cancelled   { background: #fee2e2; color: #991b1b; }
.badge-cancelled .dot { background: #ef4444; }

.payment-paid { color: var(--success); font-weight: 700; }
.payment-pending { color: var(--warning); font-weight: 700; }

/* ── Filters bar ── */
.filters {
  display: flex; gap: 10px; flex-wrap: wrap;
  margin-bottom: 16px; align-items: center;
}
.filters input, .filters select {
  padding: 9px 14px;
  background: white;
  border: 1.5px solid var(--line);
  border-radius: 100px;
  font-size: 0.86rem; font-weight: 600;
  outline: none;
  transition: all 0.2s;
}
.filters input:focus, .filters select:focus { border-color: var(--gold); }
.filters input[type="search"] { min-width: 220px; }

/* ── Calendar ── */
.cal-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px;
  margin-bottom: 18px;
}
.cal-nav { display: flex; gap: 8px; align-items: center; }
.cal-nav button {
  width: 34px; height: 34px;
  background: white; border: 1.5px solid var(--line);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.cal-nav button:hover { border-color: var(--gold); }
.cal-nav button svg { width: 14px; height: 14px; }
.cal-title {
  font-size: 1.2rem; font-weight: 800;
  letter-spacing: -0.01em;
  min-width: 200px; text-align: center;
  text-transform: capitalize;
}
.cal-views { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 100px; }
.cal-views button {
  padding: 7px 16px;
  font-size: 0.82rem; font-weight: 700;
  border-radius: 100px;
  color: var(--slate);
  transition: all 0.2s;
}
.cal-views button.active { background: var(--ink); color: white; }

.cal-month {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1px;
  background: var(--line);
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.cal-day-header {
  background: var(--bg);
  padding: 12px 10px;
  font-size: 0.72rem; font-weight: 800;
  color: var(--slate);
  text-transform: uppercase; letter-spacing: 0.08em;
  text-align: center;
}
.cal-day {
  background: white;
  min-height: 110px;
  padding: 8px 10px;
  position: relative;
  cursor: pointer;
  transition: background 0.15s;
}
.cal-day:hover { background: var(--bg); }
.cal-day.other-month { background: #fafbfc; }
.cal-day.other-month .cal-day-num { color: var(--muted); }
.cal-day.today { background: var(--gold-pale); }
.cal-day.today .cal-day-num {
  background: var(--gold-deep); color: white;
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800;
}
.cal-day.blocked { background: #fee2e2; }
.cal-day-num { font-size: 0.85rem; font-weight: 800; color: var(--ink); margin-bottom: 6px; }
.cal-events { display: flex; flex-direction: column; gap: 3px; }
.cal-event {
  font-size: 0.7rem; font-weight: 700;
  padding: 3px 7px;
  border-radius: 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  cursor: pointer;
  transition: transform 0.1s;
}
.cal-event:hover { transform: translateX(2px); }
.cal-event.dep { background: #dbeafe; color: #1e40af; border-left: 3px solid #3b82f6; }
.cal-event.ret { background: #fef3c7; color: #92400e; border-left: 3px solid #f59e0b; }
.cal-event.dep::before { content: '↗ '; }
.cal-event.ret::before { content: '↙ '; }

/* Week view */
.cal-week {
  display: grid;
  grid-template-columns: 70px repeat(7, 1fr);
  background: var(--line);
  gap: 1px;
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
.cal-week-header { background: var(--bg); padding: 12px 8px; text-align: center; font-size: 0.78rem; font-weight: 800; }
.cal-week-header.today-h { background: var(--gold-pale); color: var(--gold-deep); }
.cal-week-header .day { font-size: 0.7rem; color: var(--slate); text-transform: uppercase; letter-spacing: 0.08em; }
.cal-week-header .num { font-size: 1.2rem; font-weight: 800; }
.cal-week-row { background: white; padding: 8px; min-height: 80px; font-size: 0.78rem; }
.cal-week-row.label {
  background: var(--bg); font-weight: 800; color: var(--slate);
  display: flex; align-items: center; justify-content: center;
  text-align: center; font-size: 0.72rem;
  text-transform: uppercase; letter-spacing: 0.08em;
}
.cal-week-cell {
  display: flex; flex-direction: column; gap: 4px;
  padding: 6px;
}

/* ── Modals ── */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(11,20,38,0.7);
  backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;
  z-index: 100;
  padding: 20px;
  overflow-y: auto;
}
.modal-bg.show { display: flex; }
.modal-card {
  background: white;
  border-radius: 18px;
  width: 100%; max-width: 600px;
  max-height: 92vh;
  overflow-y: auto;
  padding: 28px 32px;
  margin: auto;
}
.modal-card.lg { max-width: 760px; }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 22px;
}
.modal-head h2 {
  font-size: 1.3rem; font-weight: 800;
  letter-spacing: -0.01em;
}
.modal-close-btn {
  width: 32px; height: 32px;
  border-radius: 50%; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.modal-close-btn:hover { background: var(--ink); color: white; }
.modal-close-btn svg { width: 16px; height: 16px; }

/* ── Forms ── */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 14px;
  margin-bottom: 16px;
}
.form-grid .full { grid-column: 1 / -1; }
.field label {
  display: block;
  font-size: 0.72rem; font-weight: 700;
  color: var(--slate);
  letter-spacing: 0.04em; text-transform: uppercase;
  margin-bottom: 5px;
}
.field input, .field select, .field textarea {
  width: 100%;
  padding: 11px 13px;
  background: var(--bg);
  border: 1.5px solid transparent;
  border-radius: 10px;
  font-size: 0.9rem;
  font-weight: 500;
  outline: none;
  transition: all 0.2s;
}
.field input:focus, .field select:focus, .field textarea:focus {
  background: white;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(232,179,98,0.15);
}
.field textarea { min-height: 80px; resize: vertical; }
.field .hint { font-size: 0.74rem; color: var(--muted); margin-top: 4px; font-weight: 500; }

/* ── Booking detail status flow ── */
.status-flow {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin: 16px 0;
}
.status-btn {
  padding: 8px 14px;
  border: 1.5px solid var(--line);
  background: white;
  border-radius: 100px;
  font-size: 0.78rem; font-weight: 700;
  color: var(--slate);
  display: inline-flex; align-items: center; gap: 6px;
  transition: all 0.2s;
}
.status-btn:hover { border-color: var(--gold); color: var(--ink); }
.status-btn.confirmed:hover { background: #dbeafe; border-color: #3b82f6; color: #1e40af; }
.status-btn.taken:hover { background: #ede9fe; border-color: #8b5cf6; color: #5b21b6; }
.status-btn.in_storage:hover { background: #d1fae5; border-color: #10b981; color: #065f46; }
.status-btn.returned:hover { background: #f3f4f6; border-color: #6b7280; color: #374151; }
.status-btn.cancelled:hover { background: #fee2e2; border-color: #ef4444; color: #991b1b; }

/* ── Empty state ── */
.empty {
  text-align: center; padding: 50px 20px;
  color: var(--slate);
}
.empty svg { width: 60px; height: 60px; margin: 0 auto 16px; opacity: 0.4; }
.empty p { font-size: 0.96rem; font-weight: 600; }

/* ── Utility ── */
.flex { display: flex; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.gap-sm { gap: 8px; }
.gap-md { gap: 14px; }
.mt-sm { margin-top: 10px; }
.mt-md { margin-top: 16px; }
.mt-lg { margin-top: 24px; }
.mb-sm { margin-bottom: 10px; }
.mb-md { margin-bottom: 16px; }
.text-muted { color: var(--slate); font-size: 0.84rem; }
.text-tiny { font-size: 0.74rem; }
.text-bold { font-weight: 800; }
.text-gold { color: var(--gold-deep); }
.text-error { color: var(--error); }
.text-success { color: var(--success); }
.text-right { text-align: right; }
.font-mono { font-family: ui-monospace, 'SF Mono', monospace; }

.toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: var(--ink); color: white;
  padding: 13px 20px;
  border-radius: 12px;
  font-size: 0.86rem; font-weight: 600;
  box-shadow: 0 12px 30px rgba(0,0,0,0.3);
  z-index: 200;
  transform: translateY(100px);
  opacity: 0;
  transition: all 0.3s;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { background: var(--success); }
.toast.error { background: var(--error); }

.spinner {
  width: 16px; height: 16px;
  border: 2.5px solid rgba(0,0,0,0.1);
  border-top-color: var(--ink);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

.loading {
  padding: 60px;
  text-align: center;
  color: var(--slate);
}

@media (max-width: 900px) {
  .sidebar {
    transform: translateX(-100%);
  }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; padding: 18px; }
  .topbar { margin-bottom: 18px; }
  .form-grid { grid-template-columns: 1fr; }
  .cal-month .cal-day { min-height: 70px; padding: 5px 6px; }
  .cal-event { font-size: 0.62rem; padding: 2px 5px; }
  .modal-card { padding: 22px 18px; }
  .mobile-menu { display: flex !important; }
}
.mobile-menu {
  display: none;
  width: 36px; height: 36px;
  background: var(--ink); color: white;
  border-radius: 10px;
  align-items: center; justify-content: center;
}
.mobile-menu svg { width: 18px; height: 18px; }
</style>
</head>
<body>

<!-- ─── LOGIN SCREEN ─── -->
<div class="login-screen" id="loginScreen">
  <form class="login-box" id="loginForm" onsubmit="event.preventDefault(); doLogin();">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
        </svg>
      </div>
      <div>
        <h1>Direct Voiturier</h1>
        <p class="sub">Back-office d'administration</p>
      </div>
    </div>
    <label for="adminPass">Mot de passe</label>
    <input type="password" id="adminPass" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">Se connecter</button>
    <div class="login-error" id="loginError" style="display:none"></div>
  </form>
</div>

<!-- ─── APP ─── -->
<div class="app" id="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
        </svg>
      </div>
      <div>
        <div class="name">Direct Voiturier</div>
        <div class="tag">Admin</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <button data-view="dashboard" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Tableau de bord
      </button>
      <button data-view="calendar">

<div id="modalsContainer"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════════════════════════════
   STATE & API
═══════════════════════════════════════════════════════════ */
const STATE = {
  token: localStorage.getItem('vo_token') || null,
  view: 'dashboard',
  bookings: [],
  clients: [],
  rules: [],
  specials: [],
  blocks: [],
  promos: [],
  stats: null,
  calMode: 'month',     // month | week
  calDate: new Date(),
};

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (STATE.token) headers['Authorization'] = `Bearer ${STATE.token}`;
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 401) {
    logout();
    throw new Error('Session expirée');
  }
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `Erreur serveur (HTTP ${res.status} sur ${path})`);
  return json;
}

function toast(msg, type = 'info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  setTimeout(() => el.classList.remove('show'), 3000);
}

/* ════════════════════════════════════════════════════════════
   AUTH
═══════════════════════════════════════════════════════════ */
async function doLogin() {
  const password = document.getElementById('adminPass').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  try {
    const { token } = await api('/api/admin/login', {
      method: 'POST',
      body: JSON.stringify({ password }),
    });
    STATE.token = token;
    localStorage.setItem('vo_token', token);
    showApp();
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Se connecter';
  }
}

function logout() {
  STATE.token = null;
  localStorage.removeItem('vo_token');
  document.getElementById('app').classList.remove('show');
  document.getElementById('loginScreen').style.display = 'flex';
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('show');
  switchView('dashboard');
}

/* ════════════════════════════════════════════════════════════
   ROUTING
═══════════════════════════════════════════════════════════ */
document.querySelectorAll('.sidebar-nav button').forEach(btn => {
  btn.addEventListener('click', () => switchView(btn.dataset.view));
});

async function switchView(view) {
  STATE.view = view;
  document.querySelectorAll('.sidebar-nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  const container = document.getElementById('viewContainer');
  container.innerHTML = '<div class="loading"><span class="spinner"></span> Chargement…</div>';

  try {
    if (view === 'dashboard') await renderDashboard();
    else if (view === 'calendar') await renderCalendar();
    else if (view === 'bookings') await renderBookings();
    else if (view === 'clients') await renderClients();
    else if (view === 'pricing') await renderPricing();
    else if (view === 'promos') await renderPromos();
    else if (view === 'categories') await renderCategories();
    else if (view === 'surcharges') await renderSurcharges();
    else if (view === 'quotes') await renderQuotes();
    else if (view === 'templates') await renderTemplates();
    else if (view === 'settings') await renderSettings();
  } catch (err) {
    container.innerHTML = `<div class="empty"><p>Erreur : ${err.message}</p></div>`;
  }
}

/* ════════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════ */
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtDateLong(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
}
function fmtMonth(d) {
  return d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function statusLabel(s) {
  return ({
    pending: 'En attente',
    confirmed: 'Confirmée',
    taken: 'Prise en charge',
    in_storage: 'En stock',
    returned: 'Restituée',
    cancelled: 'Annulée',
  })[s] || s;
}
function statusBadge(s) {
  return `<span class="badge badge-${s}"><span class="dot"></span>${statusLabel(s)}</span>`;
}
function washLabel(t) {
  return ({
    none: 'Aucun', exterieur: 'Extérieur', interieur: 'Intérieur',
    complet: 'Complet', premium: 'Premium',
  })[t] || '—';
}
function categoryLabel(code) {
  return ({
    citadine: 'Citadine', berline: 'Berline / Break',
    suv: 'SUV / 4×4 / Monospace', utilitaire: 'Van / Utilitaire',
  })[code] || code || '—';
}

/* ════════════════════════════════════════════════════════════
   VIEW: DASHBOARD
═══════════════════════════════════════════════════════════ */
async function renderDashboard() {
  const { stats } = { stats: await api('/api/admin/stats') };
  STATE.stats = stats;
  const c = document.getElementById('viewContainer');
  c.innerHTML = `
    <div class="topbar">
      <div>
        <h1>Tableau de bord</h1>
        <p class="sub">Vue d'ensemble de l'activité — ${fmtDateLong(todayISO())}</p>
      </div>
      <button class="btn btn-gold" onclick="openBookingForm()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Nouvelle réservation
      </button>
    </div>

    <div class="stats-grid">
      <div class="stat gold">
        <div class="stat-label">Revenus du mois</div>
        <div class="stat-val">${stats.month_revenue}<span class="cur">€</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">Total réservations</div>
        <div class="stat-val">${stats.total_bookings}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Départs aujourd'hui</div>
        <div class="stat-val">${stats.today_departures}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Retours aujourd'hui</div>
        <div class="stat-val">${stats.today_returns}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Voitures en stock</div>
        <div class="stat-val">${stats.in_storage}</div>
      </div>
    </div>

    <div class="card card-pad-0">
      <div style="padding:18px 22px; border-bottom: 1px solid var(--line); display:flex; justify-content:space-between; align-items:center;">
        <h2 style="font-size:1rem; font-weight:800;">Prochaines arrivées</h2>
        <button class="btn btn-ghost btn-sm" onclick="switchView('calendar')">
          Voir le calendrier
        </button>
      </div>
      ${stats.upcoming.length === 0 ? `
        <div class="empty">
          <p>Aucune arrivée prévue</p>
        </div>
      ` : `
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Date</th><th>Heure</th><th>Client</th><th>Véhicule</th><th>Terminal</th><th>Réf.</th></tr>
            </thead>
            <tbody>
              ${stats.upcoming.map(b => `
                <tr onclick="openBookingDetail('${b.reference}')">
                  <td><strong>${fmtDate(b.departure_date)}</strong></td>
                  <td>${b.departure_time?.slice(0,5) || ''}</td>
                  <td>${escapeHtml(b.customer_firstname)} ${escapeHtml(b.customer_lastname)}</td>
                  <td>${escapeHtml(b.car_brand)} ${escapeHtml(b.car_model)} <span class="text-muted text-tiny">${escapeHtml(b.car_plate)}</span></td>
                  <td>${escapeHtml(b.departure_terminal || '—')}</td>
                  <td class="font-mono text-tiny">${b.reference}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;
}

/* ════════════════════════════════════════════════════════════
   VIEW: BOOKINGS
═══════════════════════════════════════════════════════════ */
async function renderBookings(filters = {}) {
  const params = new URLSearchParams(filters).toString();
  const { bookings } = await api('/api/admin/bookings' + (params ? '?' + params : ''));
  STATE.bookings = bookings;

  const c = document.getElementById('viewContainer');
  c.innerHTML = `
    <div class="topbar">
      <div>
        <h1>Réservations</h1>
        <p class="sub">${bookings.length} réservation(s) trouvée(s)</p>
      </div>
      <button class="btn btn-gold" onclick="openBookingForm()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Nouvelle
      </button>
    </div>

    <div class="filters">
      <input type="search" id="bkSearch" placeholder="Référence, nom, plaque, email…" value="${escapeHtml(filters.q || '')}">
      <select id="bkStatus">
        <option value="">Tous les statuts</option>
        <option value="pending"${filters.status==='pending'?' selected':''}>En attente</option>
        <option value="confirmed"${filters.status==='confirmed'?' selected':''}>Confirmée</option>
        <option value="taken"${filters.status==='taken'?' selected':''}>Prise en charge</option>
        <option value="in_storage"${filters.status==='in_storage'?' selected':''}>En stock</option>
        <option value="returned"${filters.status==='returned'?' selected':''}>Restituée</option>
        <option value="cancelled"${filters.status==='cancelled'?' selected':''}>Annulée</option>
      </select>
      <input type="date" id="bkFrom" value="${filters.from || ''}" placeholder="Du">
      <input type="date" id="bkTo" value="${filters.to || ''}" placeholder="Au">
      <button class="btn btn-primary btn-sm" onclick="applyBookingFilters()">Filtrer</button>
      <button class="btn btn-ghost btn-sm" onclick="renderBookings({})">Réinitialiser</button>
    </div>

    <div class="card card-pad-0">
      ${bookings.length === 0 ? `
        <div class="empty">
          <p>Aucune réservation trouvée</p>
        </div>
      ` : `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Réf.</th><th>Aller</th><th>Retour</th><th>Client</th>
                <th>Véhicule</th><th>Statut</th><th>Total</th><th>Paiement</th>
              </tr>
            </thead>
            <tbody>
              ${bookings.map(b => `
                <tr onclick="openBookingDetail('${b.reference}')">
                  <td class="font-mono text-tiny text-bold">${b.reference}</td>
                  <td>
                    <div>${fmtDate(b.departure_date)}</div>
                    <div class="text-muted text-tiny">${b.departure_time?.slice(0,5) || ''} · ${escapeHtml(b.departure_terminal || '—')}</div>
                  </td>
                  <td>
                    <div>${fmtDate(b.return_date)}</div>
                    <div class="text-muted text-tiny">${b.return_time?.slice(0,5) || ''}</div>
                  </td>
                  <td>
                    <div class="text-bold">${escapeHtml(b.customer_firstname)} ${escapeHtml(b.customer_lastname)}</div>
                    <div class="text-muted text-tiny">${escapeHtml(b.customer_phone)}</div>
                  </td>
                  <td>
                    <div>${escapeHtml(b.car_brand)} ${escapeHtml(b.car_model)}</div>
                    <div class="text-muted text-tiny">${escapeHtml(b.car_plate)}${b.parking_spot ? ' · 📍 '+escapeHtml(b.parking_spot) : ''}</div>
                  </td>
                  <td>${statusBadge(b.status)}</td>
                  <td class="text-bold">${b.total_price}€</td>
                  <td><span class="${b.payment_status==='paid'?'payment-paid':'payment-pending'}">${b.payment_status==='paid'?'✓ Payé':'⏳ En attente'}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;
}

function applyBookingFilters() {
  const filters = {
    q: document.getElementById('bkSearch').value,
    status: document.getElementById('bkStatus').value,
    from: document.getElementById('bkFrom').value,
    to: document.getElementById('bkTo').value,
  };
  Object.keys(filters).forEach(k => !filters[k] && delete filters[k]);
  renderBookings(filters);
}

/* ════════════════════════════════════════════════════════════
   BOOKING DETAIL & STATUS FLOW
═══════════════════════════════════════════════════════════ */
async function openBookingDetail(ref) {

  if (!b) return toast('Réservation introuvable', 'error');

    <div class="modal-bg show" onclick="if(event.target.classList.contains('modal-bg'))closeModal()">

        <div class="modal-head">
          <div>
            <h2>Réservation ${b.reference}</h2>
            <div class="mt-sm">${statusBadge(b.status)}
              <span class="${b.payment_status==='paid'?'payment-paid':'payment-pending'} text-tiny" style="margin-left:8px;">${b.payment_status==='paid'?'✓ Payé':'⏳ Paiement en attente'}</span>
            </div>
          </div>
          <button class="modal-close-btn" onclick="closeModal()">

            <div class="text-bold">${escapeHtml(b.customer_firstname)} ${escapeHtml(b.customer_lastname)}</div>
            <div class="text-muted">${escapeHtml(b.customer_email)}</div>
            <div class="text-muted">${escapeHtml(b.customer_phone)}</div>
            ${b.customer_flight ? `<div class="text-muted">Vol : ${escapeHtml(b.customer_flight)}</div>` : ''}

            <h3 class="text-tiny text-bold mt-md" style="text-transform:uppercase; letter-spacing:0.1em; color:var(--slate); margin-bottom:8px;">🚗 Véhicule</h3>
            <div class="text-bold">${escapeHtml(b.car_brand)} ${escapeHtml(b.car_model)}</div>
            <div class="text-muted">${escapeHtml(b.car_color)} · <strong>${escapeHtml(b.car_plate)}</strong></div>
            <div class="text-muted">${b.car_size === 'suv' ? 'Gros véhicule (+10€)' : 'Standard'}</div>
          </div>
          <div>
            <h3 class="text-tiny text-bold" style="text-transform:uppercase; letter-spacing:0.1em; color:var(--slate); margin-bottom:8px;">📅 Voyage</h3>
            <div><strong>Aller :</strong> ${fmtDateLong(b.departure_date)} à ${b.departure_time?.slice(0,5)}${b.departure_terminal ? ' · '+escapeHtml(b.departure_terminal) : ''}</div>
            <div><strong>Retour :</strong> ${fmtDateLong(b.return_date)} à ${b.return_time?.slice(0,5)}${b.return_terminal ? ' · '+escapeHtml(b.return_terminal) : ''}</div>

            <h3 class="text-tiny text-bold mt-md" style="text-transform:uppercase; letter-spacing:0.1em; color:var(--slate); margin-bottom:8px;">💰 Tarif</h3>
            <div>Base : ${b.base_price}€</div>
            <div>Lavage : ${washLabel(b.wash_type)} ${b.wash_price > 0 ? `(${b.wash_price}€)` : ''}</div>
            ${b.promo_code ? `<div>Code promo : <strong>${escapeHtml(b.promo_code)}</strong> <span class="text-success">(-${b.promo_discount}€)</span></div>` : ''}
            <div class="text-bold text-gold" style="font-size:1.4rem; margin-top:8px;">${b.total_price}€</div>

        </div>

        <h3 class="text-tiny text-bold mt-lg" style="text-transform:uppercase; letter-spacing:0.1em; color:var(--slate); margin-bottom:8px;">⚡ Actions rapides</h3>
        <div class="status-flow">
          <button class="status-btn confirmed" onclick="updateBookingStatus('${b.id}','confirmed')">✓ Confirmer</button>
          <button class="status-btn taken" onclick="updateBookingStatus('${b.id}','taken')">📥 Prise en charge</button>
          <button class="status-btn in_storage" onclick="updateBookingStatus('${b.id}','in_storage')">🅿️ En stock</button>

            <label>Numéro de vol</label>

async function submitNewBooking() {
  try {
    const wash = JSON.parse(document.getElementById('nf-wash').value);
    const payload = {
      customer: {
        firstname: document.getElementById('nf-firstname').value.trim(),
        lastname: document.getElementById('nf-lastname').value.trim(),
        email: document.getElementById('nf-email').value.trim(),
        phone: document.getElementById('nf-phone').value.trim(),
        flight: document.getElementById('nf-flight').value.trim(),
      },
      car: {
        brand: document.getElementById('nf-brand').value.trim(),
        model: document.getElementById('nf-model').value.trim(),
        color: document.getElementById('nf-color').value.trim(),
        plate: document.getElementById('nf-plate').value.trim().toUpperCase(),
        size: document.getElementById('nf-size').value,
      },
      departure: {
        date: document.getElementById('nf-dep-date').value,
        time: document.getElementById('nf-dep-time').value,
        terminal: document.getElementById('nf-dep-terminal').value,
      },
      return: {
        date: document.getElementById('nf-ret-date').value,
        time: document.getElementById('nf-ret-time').value,
        terminal: document.getElementById('nf-ret-terminal').value,
      },
      wash,
      promoCode: document.getElementById('nf-promo').value.trim() || null,
      status: document.getElementById('nf-status').value,
      payment_method: document.getElementById('nf-payment-method').value,
      payment_status: document.getElementById('nf-payment-status').value,
      parking_spot: document.getElementById('nf-parking-spot').value.trim(),
    };
    if (!payload.customer.firstname || !payload.customer.email || !payload.car.brand) {
      return toast('Champs requis manquants', 'error');
    }
    const { booking } = await api('/api/admin/bookings', { method: 'POST', body: JSON.stringify(payload) });
    toast(`Réservation ${booking.reference} créée`, 'success');
    closeModal();
    if (STATE.view === 'bookings') renderBookings();
    if (STATE.view === 'dashboard') renderDashboard();
    if (STATE.view === 'calendar') renderCalendar();
  } catch (err) { toast(err.message, 'error'); }
}

function openPricingForm(type, id) {
  let item = {};
  if (id) {
    if (type === 'rule')    item = STATE.rules.find(x => x.id === id) || {};
    if (type === 'special') item = STATE.specials.find(x => x.id === id) || {};
    if (type === 'block')   item = STATE.blocks.find(x => x.id === id) || {};
  }

  let formHTML = '';
  let titleStr = '';
  if (type === 'rule') {
    titleStr = id ? 'Modifier une durée' : 'Nouvelle durée tarifée';
    formHTML = `
      <div class="form-grid">
        <div class="field"><label>Nombre de jours *</label><input type="number" id="pf-days" min="1" value="${item.days_min || 1}" required><div class="hint">Une ligne par durée : 1 jour = 29 €, 2 jours = 49 €, etc.</div></div>
        <div class="field"><label>Prix (€) *</label><input type="number" id="pf-price_eur" step="0.01" value="${item.price_eur || ''}" required></div>
        <div class="field full"><label>+ €/jour au-delà (optionnel)</label><input type="number" step="0.01" id="pf-extra_per_day_eur" value="${item.extra_per_day_eur || ''}"><div class="hint">À renseigner sur la dernière durée de la grille : chaque jour supplémentaire au-delà est facturé ce montant. Laisse vide pour un prix fixe.</div></div>
        <div class="field"><label>Libellé</label><input id="pf-label" value="${escapeHtml(item.label || '')}"></div>
      </div>
    `;
  } else if (type === 'special') {
    titleStr = id ? 'Modifier une période' : 'Nouvelle période spéciale';
    formHTML = `
      <div class="form-grid">
        <div class="field full"><label>Nom *</label><input id="pf-name" value="${escapeHtml(item.name || '')}" placeholder="Ex. Vacances de Noël 2026" required></div>

async function submitPricing(type, id) {
  try {
    let payload = {};
    if (type === 'rule') {
      const extraPerDay = document.getElementById('pf-extra_per_day_eur').value;
      payload = {
        // Une ligne = une durée précise : days_min et days_max sont identiques.
        days_min: parseInt(document.getElementById('pf-days').value, 10),
        days_max: parseInt(document.getElementById('pf-days').value, 10),
        price_eur: parseFloat(document.getElementById('pf-price_eur').value),
        extra_per_day_eur: extraPerDay ? parseFloat(extraPerDay) : null,
        label: document.getElementById('pf-label').value.trim(),
      };
    } else if (type === 'special') {
      payload = {
        name: document.getElementById('pf-name').value.trim(),
        date_start: document.getElementById('pf-date_start').value,
        date_end: document.getElementById('pf-date_end').value,
        multiplier: parseFloat(document.getElementById('pf-multiplier').value) || 1,
        flat_extra: parseFloat(document.getElementById('pf-flat_extra').value) || 0,
        active: document.getElementById('pf-active').checked,
      };
    } else {
      payload = {
        date_start: document.getElementById('pf-date_start').value,
        date_end: document.getElementById('pf-date_end').value,
        reason: document.getElementById('pf-reason').value.trim(),
      };
    }
    const url = `/api/admin/pricing?type=${type}` + (id ? `&id=${id}` : '');
    await api(url, { method: id ? 'PATCH' : 'POST', body: JSON.stringify(payload) });
    toast('Enregistré', 'success');
    closeModal();
    renderPricing();
  } catch (err) { toast(err.message, 'error'); }
}

async function renderCalendar() {
  const start = new Date(STATE.calDate.getFullYear(), STATE.calDate.getMonth() - 1, 1);
  const end = new Date(STATE.calDate.getFullYear(), STATE.calDate.getMonth() + 2, 0);
  const fromIso = start.toISOString().slice(0,10);
  const toIso = end.toISOString().slice(0,10);

  const [{ bookings }, { blocks }] = await Promise.all([
    api(`/api/admin/bookings?from=${fromIso}&to=${toIso}&limit=500`),
    api('/api/admin/pricing'),
  ]);
  STATE.bookings = bookings;
  STATE.blocks = blocks;

  const c = document.getElementById('viewContainer');
  c.innerHTML = `
    <div class="topbar">
      <div>
        <h1>Calendrier</h1>
        <p class="sub">Vue ${STATE.calMode === 'month' ? 'mensuelle' : 'hebdomadaire'} des arrivées et départs</p>
      </div>
      <button class="btn btn-gold" onclick="openBookingForm()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Nouvelle
      </button>
    </div>

    <div class="cal-toolbar">
      <div class="cal-nav">
        <button onclick="calPrev()" aria-label="Précédent">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="cal-title" id="calTitle"></div>
        <button onclick="calNext()" aria-label="Suivant">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <div class="flex gap-sm">
        <button class="btn btn-ghost btn-sm" onclick="calToday()">Aujourd'hui</button>
        <div class="cal-views">
          <button class="${STATE.calMode==='month'?'active':''}" onclick="calSetMode('month')">Mois</button>
          <button class="${STATE.calMode==='week'?'active':''}" onclick="calSetMode('week')">Semaine</button>
        </div>
      </div>
    </div>

    <div class="card" style="padding:8px;">
      <div style="display:flex; gap:14px; padding:8px 14px; font-size:0.78rem; flex-wrap:wrap;">
        <span class="flex" style="align-items:center; gap:6px;"><span style="width:12px; height:12px; background:#3b82f6; border-radius:3px;"></span>Départ (aller)</span>
        <span class="flex" style="align-items:center; gap:6px;"><span style="width:12px; height:12px; background:#f59e0b; border-radius:3px;"></span>Retour</span>
        <span class="flex" style="align-items:center; gap:6px;"><span style="width:12px; height:12px; background:#fee2e2; border-radius:3px;"></span>Bloqué</span>
        <span class="flex" style="align-items:center; gap:6px;"><span style="width:12px; height:12px; background:#FBF3E0; border-radius:3px;"></span>Aujourd'hui</span>
      </div>
      <div id="calBody"></div>
    </div>
  `;

  drawCalendar();
}

function calPrev() {
  if (STATE.calMode === 'month') {
    STATE.calDate.setMonth(STATE.calDate.getMonth() - 1);
  } else {
    STATE.calDate.setDate(STATE.calDate.getDate() - 7);
  }
  renderCalendar();
}
function calNext() {
  if (STATE.calMode === 'month') {
    STATE.calDate.setMonth(STATE.calDate.getMonth() + 1);
  } else {
    STATE.calDate.setDate(STATE.calDate.getDate() + 7);
  }
  renderCalendar();
}
function calToday() {
  STATE.calDate = new Date();
  renderCalendar();
}
function calSetMode(mode) {
  STATE.calMode = mode;
  renderCalendar();
}

function drawCalendar() {
  document.getElementById('calTitle').textContent = STATE.calMode === 'month'
    ? fmtMonth(STATE.calDate)
    : weekRangeLabel(STATE.calDate);

  if (STATE.calMode === 'month') {
    drawMonthView();
  } else {
    drawWeekView();
  }
}

function isDateBlocked(iso) {
  return STATE.blocks.some(b => iso >= b.date_start && iso <= b.date_end);
}

function drawMonthView() {
  const year = STATE.calDate.getFullYear();
  const month = STATE.calDate.getMonth();
  const first = new Date(year, month, 1);
  const last = new Date(year, month + 1, 0);
  const startDay = (first.getDay() + 6) % 7; // lundi = 0
  const total = startDay + last.getDate();
  const rows = Math.ceil(total / 7);

  const todayIso = todayISO();

  const days = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  let html = '<div class="cal-month">';
  days.forEach(d => html += `<div class="cal-day-header">${d}</div>`);

  for (let i = 0; i < rows * 7; i++) {
    const dayNum = i - startDay + 1;
    const cur = new Date(year, month, dayNum);
    const iso = cur.toISOString().slice(0, 10);
    const inMonth = cur.getMonth() === month;
    const isToday = iso === todayIso;
    const isBlocked = isDateBlocked(iso);

    const deps = STATE.bookings.filter(b => b.departure_date === iso && b.status !== 'cancelled');
    const rets = STATE.bookings.filter(b => b.return_date === iso && b.status !== 'cancelled');

    let classes = 'cal-day';
    if (!inMonth) classes += ' other-month';
    if (isToday) classes += ' today';
    if (isBlocked) classes += ' blocked';

    html += `<div class="${classes}">
      <div class="cal-day-num">${cur.getDate()}</div>
      <div class="cal-events">
        ${deps.slice(0, 3).map(b => `<div class="cal-event dep" onclick="event.stopPropagation();openBookingDetail('${b.reference}')" title="${escapeHtml(b.customer_lastname)} - ${escapeHtml(b.car_plate)} - ${b.departure_time?.slice(0,5)}">${b.departure_time?.slice(0,5) || ''} ${escapeHtml(b.customer_lastname)}</div>`).join('')}
        ${rets.slice(0, 3).map(b => `<div class="cal-event ret" onclick="event.stopPropagation();openBookingDetail('${b.reference}')" title="${escapeHtml(b.customer_lastname)} - ${escapeHtml(b.car_plate)} - ${b.return_time?.slice(0,5)}">${b.return_time?.slice(0,5) || ''} ${escapeHtml(b.customer_lastname)}</div>`).join('')}
        ${(deps.length + rets.length) > 6 ? `<div class="text-tiny text-muted">+${deps.length + rets.length - 6} autres</div>` : ''}
      </div>
    </div>`;
  }
  html += '</div>';
  document.getElementById('calBody').innerHTML = html;
}

function weekRangeLabel(d) {
  const start = new Date(d);
  start.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  const end = new Date(start); end.setDate(start.getDate() + 6);
  return `${start.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })} → ${end.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' })}`;
}

function drawWeekView() {
  const start = new Date(STATE.calDate);
  start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
  const todayIso = todayISO();
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    days.push(d);
  }

  const dayNames = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

  let html = '<div class="cal-week">';
  html += '<div class="cal-week-header"></div>';
  days.forEach((d, i) => {
    const iso = d.toISOString().slice(0,10);
    const isToday = iso === todayIso;
    html += `<div class="cal-week-header${isToday ? ' today-h' : ''}">
      <div class="day">${dayNames[i]}</div>
      <div class="num">${d.getDate()}</div>
    </div>`;
  });

  // Ligne Départs
  html += '<div class="cal-week-row label">↗ Départs</div>';
  days.forEach(d => {
    const iso = d.toISOString().slice(0,10);
    const deps = STATE.bookings.filter(b => b.departure_date === iso && b.status !== 'cancelled');
    html += `<div class="cal-week-row cal-week-cell">
      ${deps.map(b => `<div class="cal-event dep" onclick="openBookingDetail('${b.reference}')" title="${escapeHtml(b.customer_lastname)} - ${escapeHtml(b.car_plate)}">
        ${b.departure_time?.slice(0,5)} ${escapeHtml(b.customer_lastname)} <span class="text-tiny" style="opacity:0.7">${escapeHtml(b.car_plate)}</span>
      </div>`).join('')}
    </div>`;
  });

  // Ligne Retours
  html += '<div class="cal-week-row label">↙ Retours</div>';
  days.forEach(d => {
    const iso = d.toISOString().slice(0,10);
    const rets = STATE.bookings.filter(b => b.return_date === iso && b.status !== 'cancelled');
    html += `<div class="cal-week-row cal-week-cell">
      ${rets.map(b => `<div class="cal-event ret" onclick="openBookingDetail('${b.reference}')" title="${escapeHtml(b.customer_lastname)} - ${escapeHtml(b.car_plate)}">
        ${b.return_time?.slice(0,5)} ${escapeHtml(b.customer_lastname)} <span class="text-tiny" style="opacity:0.7">${escapeHtml(b.car_plate)}</span>
      </div>`).join('')}
    </div>`;
  });

  // Ligne En stock
  html += '<div class="cal-week-row label">🅿️ En stock</div>';
  days.forEach(d => {
    const iso = d.toISOString().slice(0,10);
    const inStorage = STATE.bookings.filter(b =>
      b.status !== 'cancelled' &&
      b.departure_date <= iso && b.return_date >= iso
    );
    html += `<div class="cal-week-row cal-week-cell">
      ${inStorage.length > 0 ? `<div class="text-bold text-gold" style="font-size:1.2rem;">${inStorage.length}</div><div class="text-tiny text-muted">véhicule(s)</div>` : ''}
    </div>`;
  });

  html += '</div>';
  document.getElementById('calBody').innerHTML = html;
}

function buildShareText(b, format = 'plain') {
  const fmtD = (iso) => {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('fr-FR', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
  };
  const t = (s) => (s || '').slice(0,5);
  const status = ({pending:'En attente', confirmed:'Confirmée', taken:'Prise en charge', in_storage:'En stock', returned:'Restituée', cancelled:'Annulée'})[b.status] || b.status;

  const lines = [];
  lines.push(`🚗 RÉSERVATION ${b.reference}`);
  lines.push(`Statut : ${status}${b.payment_status === 'paid' ? ' · ✓ Payé' : ' · ⏳ Paiement en attente'}`);
  lines.push('');
  lines.push('👤 CLIENT');
  lines.push(`${b.customer_firstname} ${b.customer_lastname}`);
  lines.push(`📱 ${b.customer_phone}`);
  lines.push(`📧 ${b.customer_email}`);
  if (b.customer_flight) lines.push(`✈️ Vol : ${b.customer_flight}`);
  lines.push('');
  lines.push('📅 VOYAGE');
  lines.push(`Aller : ${fmtD(b.departure_date)} à ${t(b.departure_time)}${b.departure_terminal ? ' · Terminal ' + b.departure_terminal : ''}`);
  lines.push(`Retour : ${fmtD(b.return_date)} à ${t(b.return_time)}${b.return_terminal ? ' · Terminal ' + b.return_terminal : ''}`);
  lines.push('');
  lines.push('🚙 VÉHICULE');
  lines.push(`${b.car_brand} ${b.car_model}${b.car_color ? ' · ' + b.car_color : ''}`);
  lines.push(`Plaque : ${b.car_plate}`);
  const catNames = {citadine:'Citadine', berline:'Berline / Break', suv:'SUV / 4×4 / Monospace', utilitaire:'Van / Utilitaire'};
  lines.push(`Catégorie : ${catNames[b.car_category_code] || b.car_category_code || 'Citadine'}`);
  lines.push('');
  lines.push('💰 TARIF');
  if (b.wash_type && b.wash_type !== 'none') {
    const wlbl = {exterieur:'Lavage extérieur', interieur:'Lavage intérieur', complet:'Lavage complet', premium:'Lavage premium'}[b.wash_type] || b.wash_type;
    lines.push(`${wlbl} : ${b.wash_price}€`);
  }
  if (b.has_covered_parking) lines.push(`🅿️ Parking couvert : +20€`);
  if (b.has_priority_access) lines.push(`⚡ Accès prioritaire : +20€`);
  if (b.promo_code) lines.push(`Code promo ${b.promo_code} : -${b.promo_discount}€`);
  lines.push(`💵 TOTAL : ${b.total_price}€`);

  if (b.parking_spot) {
    lines.push('');
    lines.push(`📍 Emplacement parking : ${b.parking_spot}`);
  }
  if (b.internal_notes) {
    lines.push('');
    lines.push(`📝 Notes : ${b.internal_notes}`);
  }
  lines.push('');
  lines.push('— Direct Voiturier');

  return lines.join('\n');
}

function shareViaWhatsApp() {
  const text = document.getElementById('shareText').value;
  const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank');
}

function shareViaSMS() {
  const text = document.getElementById('shareText').value;
  // Format SMS universel (iOS et Android)
  const url = `sms:?&body=${encodeURIComponent(text)}`;
  window.location.href = url;
}

function shareViaEmail() {
  const text = document.getElementById('shareText').value;
  const b = STATE.shareBooking;
  const subject = `Réservation Direct Voiturier — ${b.reference} — ${b.customer_firstname} ${b.customer_lastname}`;
  const url = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
  window.location.href = url;
}

async function copyShareText() {
  const text = document.getElementById('shareText').value;
  try {
    await navigator.clipboard.writeText(text);
    toast('Copié ! Tu peux le coller où tu veux.', 'success');
  } catch {
    // Fallback pour navigateurs anciens
    const ta = document.getElementById('shareText');
    ta.select();
    document.execCommand('copy');
    toast('Copié !', 'success');
  }
}

async function sendShareEmail(ref) {
  const to = document.getElementById('shareEmailTo').value.trim();
  const text = document.getElementById('shareText').value;
  if (!to || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) {
    toast('Email invalide', 'error');
    return;
  }
  try {
    await api('/api/admin/share-booking', {
      method: 'POST',
      body: JSON.stringify({ reference: ref, to, text }),
    });
    toast(`Email envoyé à ${to}`, 'success');
  } catch (err) {
    toast(err.message, 'error');
  }
}

        <h2 style="font-size:1.05rem; font-weight:800;">⏰ Suppléments horaires</h2>
        <button class="btn btn-primary btn-sm" onclick="openSurchargeForm('time_window')">+ Ajouter un supplément horaire</button>
      </div>
      ${timeWindows.length === 0 ? '<div class="text-muted">Aucun supplément horaire</div>' : `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Nom</th><th>Plage horaire</th><th>S'applique à</th><th>Montant</th><th>Statut</th><th></th></tr></thead>
            <tbody>
              ${timeWindows.map(s => `
                <tr>
                  <td class="text-bold">${escapeHtml(s.name)}${s.description ? `<div class="text-tiny text-muted">${escapeHtml(s.description)}</div>` : ''}</td>
                  <td class="font-mono">${hhmm(s.time_start)} – ${hhmm(s.time_end)}</td>
                  <td>${appliesToLabel(s.applies_to)}</td>
                  <td class="text-bold">+${s.amount_eur}€</td>
                  <td>${s.active !== false ? '<span class="text-success">✓ Actif</span>' : '<span class="text-muted">Inactif</span>'}</td>
                  <td class="text-right">
                    <button class="btn btn-ghost btn-sm" onclick="openSurchargeForm('time_window','${s.id}')">Modifier</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteSurcharge('${s.id}')">×</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>

    <div class="card">
      <div class="flex-between mb-md">
        <h2 style="font-size:1.05rem; font-weight:800;">⚙️ Options</h2>
        <button class="btn btn-primary btn-sm" onclick="openSurchargeForm('option')">+ Ajouter une option</button>
      </div>
      ${options.length === 0 ? '<div class="text-muted">Aucune option</div>' : `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Nom</th><th>Code</th><th>Montant</th><th>Statut</th><th></th></tr></thead>
            <tbody>
              ${options.map(s => `
                <tr>
                  <td class="text-bold">${escapeHtml(s.name)}${s.description ? `<div class="text-tiny text-muted">${escapeHtml(s.description)}</div>` : ''}</td>
                  <td class="font-mono">${escapeHtml(s.option_code || '—')}</td>
                  <td class="text-bold">+${s.amount_eur}€</td>
                  <td>${s.active !== false ? '<span class="text-success">✓ Actif</span>' : '<span class="text-muted">Inactif</span>'}</td>
                  <td class="text-right">
                    <button class="btn btn-ghost btn-sm" onclick="openSurchargeForm('option','${s.id}')">Modifier</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteSurcharge('${s.id}')">×</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;
}

function openSurchargeForm(kind, id) {
  const item = id ? (STATE.surcharges.find(x => x.id === id) || {}) : {};
  const titleStr = (id ? 'Modifier ' : 'Ajouter ') + (kind === 'option' ? 'une option' : 'un supplément horaire');
  const html = `
    <div class="modal-bg show" onclick="if(event.target.classList.contains('modal-bg'))closeModal()">
      <div class="modal-card">
        <div class="modal-head">
          <h2>${titleStr}</h2>
          <button class="modal-close-btn" onclick="closeModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="form-grid">
          <div class="field full"><label>Nom *</label><input id="sf-name" value="${escapeHtml(item.name || '')}" required></div>
          <div class="field full"><label>Description</label><input id="sf-description" value="${escapeHtml(item.description || '')}"></div>
          ${kind === 'time_window' ? `
            <div class="field"><label>Heure début *</label><input type="time" id="sf-time_start" value="${hhmm(item.time_start)}" required></div>
            <div class="field"><label>Heure fin *</label><input type="time" id="sf-time_end" value="${hhmm(item.time_end)}" required></div>
            <div class="field full"><label>S'applique à</label>
              <select id="sf-applies_to">
                <option value="both" ${item.applies_to === 'both' || !item.applies_to ? 'selected' : ''}>Départ & retour</option>
                <option value="departure" ${item.applies_to === 'departure' ? 'selected' : ''}>Départ uniquement</option>
                <option value="return" ${item.applies_to === 'return' ? 'selected' : ''}>Retour uniquement</option>
              </select>
            </div>
          ` : `
            <div class="field full"><label>Code option *</label><input id="sf-option_code" value="${escapeHtml(item.option_code || '')}" placeholder="Ex. covered_parking" required></div>
          `}
          <div class="field"><label>Montant (€) *</label><input type="number" step="0.01" id="sf-amount_eur" value="${item.amount_eur ?? ''}" required></div>
          <div class="field"><label>Ordre d'affichage</label><input type="number" id="sf-display_order" value="${item.display_order ?? 0}"></div>
          <div class="field full"><label><input type="checkbox" id="sf-active" ${item.active !== false ? 'checked' : ''} style="width:auto;margin-right:6px"> Actif</label></div>
        </div>
        <div class="flex-between mt-md">
          <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
          <button class="btn btn-primary" onclick="submitSurcharge('${kind}'${id ? `,'${id}'` : ''})">Enregistrer</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalsContainer').innerHTML = html;
}

async function submitSurcharge(kind, id) {
  try {
    const payload = {
      kind,
      name: document.getElementById('sf-name').value.trim(),
      description: document.getElementById('sf-description').value.trim(),
      amount_eur: parseFloat(document.getElementById('sf-amount_eur').value) || 0,
      display_order: parseInt(document.getElementById('sf-display_order').value, 10) || 0,
      active: document.getElementById('sf-active').checked,
    };
    if (kind === 'time_window') {
      payload.time_start = document.getElementById('sf-time_start').value;
      payload.time_end = document.getElementById('sf-time_end').value;
      payload.applies_to = document.getElementById('sf-applies_to').value;
    } else {
      payload.option_code = document.getElementById('sf-option_code').value.trim();
    }
    const url = '/api/admin/surcharges' + (id ? '?id=' + id : '');
    await api(url, { method: id ? 'PATCH' : 'POST', body: JSON.stringify(payload) });
    toast('Enregistré', 'success');
    closeModal();
    renderSurcharges();
  } catch (err) { toast(err.message, 'error'); }
}

async function deleteSurcharge(id) {
  if (!confirm('Supprimer ce supplément ?')) return;
  try {
    await api('/api/admin/surcharges?id=' + id, { method: 'DELETE' });
    toast('Supprimé', 'success');
    renderSurcharges();
  } catch (err) { toast(err.message, 'error'); }
}

/* ════════════════════════════════════════════════════════════
   VIEW: QUOTES (devis)
═══════════════════════════════════════════════════════════ */
function quoteStatusInfo(s) {
  return ({
    draft: { label: 'Brouillon', cls: 'badge-pending' },
    sent: { label: 'Envoyé', cls: 'badge-confirmed' },
    accepted: { label: 'Accepté', cls: 'badge-in_storage' },
  })[s] || { label: s || '—', cls: 'badge-returned' };
}
function quoteStatusBadge(s) {
  const info = quoteStatusInfo(s);
  return `<span class="badge ${info.cls}"><span class="dot"></span>${info.label}</span>`;
}

async function renderQuotes() {
  const { quotes } = await api('/api/admin/quotes');
  STATE.quotes = quotes;
  const c = document.getElementById('viewContainer');
  c.innerHTML = `
    <div class="topbar">
      <div>
        <h1>Devis</h1>
        <p class="sub">${quotes.length} devis</p>
      </div>
      <button class="btn btn-gold" onclick="openQuoteForm()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Nouveau devis
      </button>
    </div>

    <div class="card card-pad-0">
      ${quotes.length === 0 ? '<div class="empty"><p>Aucun devis</p></div>' : `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Référence</th><th>Client</th><th>Voyage</th><th>Catégorie</th><th>Total</th><th>Statut</th><th>Validité</th><th></th></tr></thead>
            <tbody>
              ${quotes.map(q => `
                <tr>
                  <td class="font-mono text-bold">${escapeHtml(q.reference)}</td>
                  <td>
                    <div class="text-bold">${escapeHtml(q.customer_firstname)} ${escapeHtml(q.customer_lastname)}</div>
                    <div class="text-tiny text-muted">${escapeHtml(q.customer_email || '—')}</div>
                  </td>
                  <td class="text-tiny">${fmtDate(q.departure_date)} → ${fmtDate(q.return_date)}</td>
                  <td>${categoryLabel(q.car_category_code)}</td>
                  <td class="text-bold">${q.total_price}€</td>
                  <td>${quoteStatusBadge(q.status)}</td>
                  <td class="text-tiny">${q.valid_until ? fmtDate(q.valid_until) : '—'}</td>
                  <td class="text-right">
                    <button class="btn btn-ghost btn-sm" onclick="sendQuote('${q.id}')" ${q.customer_email ? '' : 'disabled title="Email client requis"'}>Envoyer</button>
                    ${q.status === 'accepted'
                      ? ''
                      : `<button class="btn btn-ghost btn-sm" onclick="convertQuote('${q.id}')">Convertir</button>`}
                    <button class="btn btn-danger btn-sm" onclick="deleteQuote('${q.id}')">×</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;
}

function openQuoteForm() {
  const html = `
    <div class="modal-bg show" onclick="if(event.target.classList.contains('modal-bg'))closeModal()">
      <div class="modal-card lg">
        <div class="modal-head">
          <h2>Nouveau devis</h2>
          <button class="modal-close-btn" onclick="closeModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <h3 class="text-tiny text-bold" style="text-transform:uppercase; letter-spacing:0.1em; color:var(--slate); margin-bottom:8px;">Client</h3>
        <div class="form-grid">
          <div class="field"><label>Prénom</label><input id="qf-firstname"></div>
          <div class="field"><label>Nom</label><input id="qf-lastname"></div>
          <div class="field"><label>Email</label><input id="qf-email" type="email"></div>
          <div class="field"><label>Téléphone</label><input id="qf-phone" type="tel"></div>
        </div>

        <h3 class="text-tiny text-bold mt-md" style="text-transform:uppercase; letter-spacing:0.1em; color:var(--slate); margin-bottom:8px;">Voyage</h3>
        <div class="form-grid">
          <div class="field"><label>Date départ *</label><input id="qf-dep-date" type="date" required></div>
          <div class="field"><label>Heure départ *</label><input id="qf-dep-time" type="time" value="08:00" required></div>
          <div class="field"><label>Date retour *</label><input id="qf-ret-date" type="date" required></div>
          <div class="field"><label>Heure retour *</label><input id="qf-ret-time" type="time" value="20:00" required></div>
        </div>

        <h3 class="text-tiny text-bold mt-md" style="text-transform:uppercase; letter-spacing:0.1em; color:var(--slate); margin-bottom:8px;">Véhicule & service</h3>
        <div class="form-grid">
          <div class="field"><label>Catégorie</label>
            <select id="qf-category">
              <option value="citadine">Citadine</option>
              <option value="berline">Berline / Break</option>
              <option value="suv">SUV / 4×4 / Monospace</option>
              <option value="utilitaire">Van / Utilitaire</option>
            </select>
          </div>
          <div class="field"><label>Lavage</label>
            <select id="qf-wash">
              <option value="none">Aucun</option>
              <option value="exterieur">Extérieur</option>
              <option value="interieur">Intérieur</option>
              <option value="complet">Complet</option>
              <option value="premium">Premium</option>
            </select>
          </div>
          <div class="field"><label>Code promo</label><input id="qf-promo" style="text-transform:uppercase"></div>
          <div class="field">
            <label><input type="checkbox" id="qf-parking" style="width:auto;margin-right:6px">Parking couvert</label>
          </div>
          <div class="field">
            <label><input type="checkbox" id="qf-priority" style="width:auto;margin-right:6px">Accès prioritaire</label>
          </div>
          <div class="field full"><label>Notes</label><textarea id="qf-notes"></textarea></div>
        </div>

        <div class="flex-between mt-lg">
          <div class="text-muted text-tiny">Le tarif sera calculé automatiquement</div>
          <div class="flex gap-sm">
            <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
            <button class="btn btn-primary" onclick="submitNewQuote()">Créer le devis</button>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalsContainer').innerHTML = html;

  const today = new Date(); const tom = new Date(today); tom.setDate(tom.getDate() + 1);
  const wk = new Date(today); wk.setDate(wk.getDate() + 8);
  document.getElementById('qf-dep-date').value = tom.toISOString().slice(0, 10);
  document.getElementById('qf-ret-date').value = wk.toISOString().slice(0, 10);
}

async function submitNewQuote() {
  try {
    const payload = {
      customer_firstname: document.getElementById('qf-firstname').value.trim(),
      customer_lastname: document.getElementById('qf-lastname').value.trim(),
      customer_email: document.getElementById('qf-email').value.trim(),
      customer_phone: document.getElementById('qf-phone').value.trim(),
      departure_date: document.getElementById('qf-dep-date').value,
      departure_time: document.getElementById('qf-dep-time').value,
      return_date: document.getElementById('qf-ret-date').value,
      return_time: document.getElementById('qf-ret-time').value,
      car_category_code: document.getElementById('qf-category').value,
      wash_type: document.getElementById('qf-wash').value,
      has_covered_parking: document.getElementById('qf-parking').checked,
      has_priority_access: document.getElementById('qf-priority').checked,
      promo_code: document.getElementById('qf-promo').value.trim() || null,
      notes: document.getElementById('qf-notes').value.trim(),
    };
    if (!payload.departure_date || !payload.return_date) {
      return toast('Dates requises', 'error');
    }
    const { quote } = await api('/api/admin/quotes', { method: 'POST', body: JSON.stringify(payload) });
    toast(`Devis ${quote.reference} créé`, 'success');
    closeModal();
    renderQuotes();
  } catch (err) { toast(err.message, 'error'); }
}

async function sendQuote(id) {
  try {
    await api('/api/admin/quotes-send', { method: 'POST', body: JSON.stringify({ id }) });
    toast('Devis envoyé', 'success');
    renderQuotes();
  } catch (err) { toast(err.message, 'error'); }
}

async function convertQuote(id) {
  if (!confirm('Convertir ce devis en réservation ?')) return;
  try {
    const { booking } = await api('/api/admin/quotes?action=convert&id=' + id, { method: 'POST' });
    toast(`Réservation ${booking.reference} créée`, 'success');
    renderQuotes();
  } catch (err) { toast(err.message, 'error'); }
}

async function deleteQuote(id) {
  if (!confirm('Supprimer ce devis ?')) return;
  try {
    await api('/api/admin/quotes?id=' + id, { method: 'DELETE' });
    toast('Supprimé', 'success');
    renderQuotes();
  } catch (err) { toast(err.message, 'error'); }
}

/* ════════════════════════════════════════════════════════════
   VIEW: TEMPLATES (modèles de message SMS / email)
═══════════════════════════════════════════════════════════ */
function channelLabel(ch) { return ch === 'sms' ? 'SMS' : 'Email'; }

async function renderTemplates() {
  const { templates } = await api('/api/admin/templates');
  STATE.templates = templates;
  const c = document.getElementById('viewContainer');
  c.innerHTML = `
    <div class="topbar">
      <div>
        <h1>Messages</h1>
        <p class="sub">${templates.length} modèle(s) de message</p>
      </div>
      <button class="btn btn-gold" onclick="openTemplateForm()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Nouveau modèle
      </button>
    </div>

    <div class="card card-pad-0">
      ${templates.length === 0 ? '<div class="empty"><p>Aucun modèle</p></div>' : `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Nom</th><th>Code</th><th>Canal</th><th>Statut</th><th></th></tr></thead>
            <tbody>
              ${templates.map(t => `
                <tr>
                  <td class="text-bold">${escapeHtml(t.name)}</td>
                  <td class="font-mono text-tiny">${escapeHtml(t.code)}</td>
                  <td>${channelLabel(t.channel)}</td>
                  <td>${t.active !== false ? '<span class="text-success">✓ Actif</span>' : '<span class="text-muted">Inactif</span>'}</td>
                  <td class="text-right">
                    <button class="btn btn-ghost btn-sm" onclick="openTemplateForm('${t.id}')">Modifier</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteTemplate('${t.id}')">×</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;
}

function openTemplateForm(id) {
  const item = id ? (STATE.templates.find(x => x.id === id) || {}) : {};
  const titleStr = id ? 'Modifier le modèle' : 'Nouveau modèle de message';
  const html = `
    <div class="modal-bg show" onclick="if(event.target.classList.contains('modal-bg'))closeModal()">
      <div class="modal-card lg">
        <div class="modal-head">
          <h2>${titleStr}</h2>
          <button class="modal-close-btn" onclick="closeModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="form-grid">
          <div class="field"><label>Nom *</label><input id="tf-name" value="${escapeHtml(item.name || '')}" required></div>
          <div class="field"><label>Code *</label><input id="tf-code" value="${escapeHtml(item.code || '')}" ${id ? 'readonly' : ''} required></div>
          <div class="field"><label>Canal *</label>
            <select id="tf-channel" onchange="document.getElementById('tf-subject-field').style.display = this.value === 'email' ? '' : 'none'">
              <option value="sms" ${item.channel === 'sms' ? 'selected' : ''}>SMS</option>
              <option value="email" ${item.channel === 'email' ? 'selected' : ''}>Email</option>
            </select>
          </div>
          <div class="field" id="tf-subject-field" style="display:${item.channel === 'email' ? '' : 'none'}">
            <label>Objet (email)</label><input id="tf-subject" value="${escapeHtml(item.subject || '')}">
          </div>
          <div class="field full"><label>Message * <span class="text-tiny text-muted">(variables : {{firstname}}, {{reference}}, {{dep_date}}, {{dep_time}}, {{terminal}}, {{phone_business}}, {{car_brand}}, {{car_model}}, {{car_plate}}…)</span></label>
            <textarea id="tf-body" rows="8" required>${escapeHtml(item.body || '')}</textarea>
          </div>
          <div class="field full"><label><input type="checkbox" id="tf-active" ${item.active !== false ? 'checked' : ''} style="width:auto;margin-right:6px"> Actif</label></div>
        </div>
        <div class="flex-between mt-md">
          <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
          <button class="btn btn-primary" onclick="submitTemplate(${id ? `'${id}'` : 'undefined'})">Enregistrer</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalsContainer').innerHTML = html;
}

async function submitTemplate(id) {
  try {
    const channel = document.getElementById('tf-channel').value;
    const payload = {
      name: document.getElementById('tf-name').value.trim(),
      code: document.getElementById('tf-code').value.trim(),
      channel,
      subject: channel === 'email' ? document.getElementById('tf-subject').value.trim() : '',
      body: document.getElementById('tf-body').value.trim(),
      active: document.getElementById('tf-active').checked,
    };
    const url = '/api/admin/templates' + (id ? '?id=' + id : '');
    await api(url, { method: id ? 'PATCH' : 'POST', body: JSON.stringify(payload) });
    toast('Enregistré', 'success');
    closeModal();
    renderTemplates();
  } catch (err) { toast(err.message, 'error'); }
}

async function deleteTemplate(id) {
  if (!confirm('Supprimer ce modèle ?')) return;
  try {
    await api('/api/admin/templates?id=' + id, { method: 'DELETE' });
    toast('Supprimé', 'success');
    renderTemplates();
  } catch (err) { toast(err.message, 'error'); }
}
